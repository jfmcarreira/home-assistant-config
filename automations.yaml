- alias: Tablet Control Hall Screen
  id: '1750634052202'
  description: Apply upstairs hall tablet settings by house mode. Off, Sleep or absence
    disables motion detection and the screen with a 60-second timeout; Night disables
    motion wake with the same timeout; other modes use brighter output and a 1200-second
    timeout.
  triggers:
