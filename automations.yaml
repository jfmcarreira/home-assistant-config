          product_id: '4'
          amount: 1
          transaction_type: CONSUME
- alias: Tarefa de Limpeza da Areia das Gatas
  id: '1709598896541'
  description: Record cat-litter cleaning completion through the tracked-task blueprint
    and refresh its last-done sensor. Reminder notifications are disabled.
  use_blueprint:
    path: tasks/tracked_tasks.yaml
    input:
      task_needs_attention: binary_sensor.cat_litter_box_need_clean
      task_sensor: sensor.cat_litter_box_last_clean
      task_done_code_name: Cat_Litter_Clean
      send_notification: false
      notification_max_time: 00:00:00
      notification_message: A Areia das Gatas Necessita de Limpeza
      notification_action: Registar Limpeza
- id: '1709743628443'
  alias: Alertar Portão Aberto com a Casa Vazia
  description: Alert Joao when the gate remains open while the house is empty, rechecking
    after five minutes of gate opening or absence. Notification actions close it or
    defer the alert by ten minutes; closing the gate does not itself clear this notification
    in the current sequence.
  triggers:
  - id: trigger_gate_open
    entity_id:
    - cover.gate
    to:
    - open
    for:
      hours: 0
      minutes: 5
      seconds: 0
    trigger: state
  - id: trigger_gate_close
    entity_id:
    - cover.gate
    to: closed
    trigger: state
  - id: trigger_house_empty
    entity_id:
    - binary_sensor.notify_home
    to:
    - 'off'
    for:
      hours: 0
      minutes: 5
      seconds: 0
    trigger: state
  - id: trigger_notification_gate_notification_action_close
    event_type: mobile_app_notification_action
    event_data:
      action: gate_notification_action_close
    trigger: event
  - id: trigger_notification_gate_notification_action_keep_open
    event_type: mobile_app_notification_action
    event_data:
      action: gate_notification_action_keep_open
    trigger: event
  conditions: []
  actions:
  - alias: Se Acção é Fechar Portão
    if:
    - condition: trigger
      id:
      - trigger_notification_gate_notification_action_close
    then:
    - data:
        message: clear_notification
        data:
          tag: notify_gate_open
          dismiss: true
      action: notify.mobile_app_all
    - condition: state
      entity_id: cover.gate
      state: open
    - data: {}
      target:
        entity_id: cover.gate
      action: cover.close_cover
    - stop: Portão fechado
  - alias: Se Acção é Deixar Aberto
    if:
    - condition: trigger
      id:
      - trigger_notification_gate_notification_action_keep_open
    then:
    - data:
        message: clear_notification
        data:
          tag: notify_gate_open
          dismiss: true
      action: notify.mobile_app_all
    - delay:
        hours: 0
        minutes: 10
        seconds: 0
        milliseconds: 0
  - condition: state
    entity_id: cover.gate
    state: open
  - condition: state
    entity_id: binary_sensor.notify_home
    state: 'off'
  - data:
      title: Exterior
      message: O Portão da Rua está Aberto
      data:
        tag: notify_gate_open
        priority: high
        persistent: true
        sticky: true
        channel: Segurança
        clickAction: /lovelace-subviews/dashboard-exterior
        actions:
        - action: gate_notification_action_keep_open
          title: Deixar Aberto
        - action: gate_notification_action_close
          title: Fechar o Portao
    action: notify.mobile_app_radium
  mode: restart
- alias: Alertar Alarme Joao Dias de Trabalho
  id: '1711849617966'
  description: Remind Joao to set a phone wake-up alarm at half-hour checks from 23:00
    to 01:30 when the next alarm is unknown or unavailable and the upcoming morning
    is a workday without a declared day off.
  trigger:
  - trigger: time
    at: '23:00:00'
  - trigger: time
    at: '23:30:00'
  - trigger: time
    at: 00:00:00
  - trigger: time
    at: 00:30:00
  - trigger: time
    at: 01:00:00
  - trigger: time
    at: 01:30:00
  condition:
  - condition: or
    conditions:
    - condition: state
      entity_id: sensor.radium_next_alarm
      state: unknown
    - condition: state
      entity_id: sensor.radium_next_alarm
      state: unavailable
    alias: Radium Without Alarm
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: time
        after: 00:00:00
        before: 07:00:00
      - condition: state
        entity_id: binary_sensor.workday
        state: 'on'
    - condition: and
      conditions:
      - condition: time
        after: 07:00:00
        before: 00:00:00
      - condition: state
        entity_id: binary_sensor.workday_tomorrow
        state: 'on'
  - condition: state
    entity_id: input_boolean.day_off_work
    state: 'off'
  action:
  - action: notify.mobile_app_radium
    data:
      title: Routinas
      message: Deve configurar o alarme para amanhã!
      data:
        tag: 923
  mode: single
- alias: Controlar Luzes do Portão
