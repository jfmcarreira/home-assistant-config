  description: Supply the living-room TV socket while someone is home between 07:00
    and 02:00; otherwise turn the TV off, wait 30 seconds, and cut socket power. Only
    act when the TV is not on and the socket state has been stable for ten minutes.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.notify_home
