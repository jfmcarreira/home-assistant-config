      entity_id: light.hall_group
    options:
      for: 00:00:00
  - condition: numeric_state
    entity_id: sensor.light_stairs_top
    above: 100
  - condition: state
    entity_id: light.stairs_group
    state:
    - 'on'
  actions:
  - data: {}
