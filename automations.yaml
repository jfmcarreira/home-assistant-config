- alias: Ajustar Volume dos Assistentes
  id: '1736788353807'
  description: Set idle or off assistant speakers to the day volume from 08:00 to
    21:00, evening volume until 23:45, and night volume otherwise. Recheck at startup,
    helper changes and configured times without interrupting active playback.
  triggers:
  - event: start
    trigger: homeassistant
  - entity_id: input_number.assistant_volume_day
    trigger: state
  - entity_id: input_number.assistant_volume_evening
    trigger: state
  - entity_id: input_number.assistant_volume_night
    trigger: state
  - minutes: 30
    trigger: time_pattern
  - at: 08:00:00
    trigger: time
  - at: '21:00:00'
    trigger: time
  - at: 00:00:00
    trigger: time
  conditions: []
  actions:
  - repeat:
      for_each:
      - media_player.ghm_kitchen
      - media_player.ghm_living_room
      - media_player.ghm_hall
      - media_player.ghm_master_bedroom
      - media_player.ghm_main_bathroom
      - media_player.home_assistant_voice_office
      sequence:
      - condition: template
        value_template: '{{ is_state(repeat.item, ''off'') or is_state(repeat.item,
          ''idle'') }}'
      - choose:
        - conditions:
          - condition: time
            after: 08:00:00
            before: '21:00:00'
          sequence:
          - action: media_player.volume_set
            target:
              entity_id: '{{ repeat.item }}'
            data:
              volume_level: '{{ ( states( ''input_number.assistant_volume_day'' )
                | int ) / 100 }}

                '
        - conditions:
          - condition: time
            after: '21:00:00'
            before: '23:45:00'
          sequence:
          - action: media_player.volume_set
            target:
              entity_id: '{{ repeat.item }}'
            data:
              volume_level: '{{ ( states( ''input_number.assistant_volume_evening''
                ) | int ) / 100 }}

                '
        default:
        - action: media_player.volume_set
          target:
            entity_id: '{{ repeat.item }}'
          data_template:
            volume_level: '{{ ( states( ''input_number.assistant_volume_night'' )
              | int ) / 100 }}

              '
  mode: single
