      sequence:
      - action: switch.turn_off
        data: {}
        target:
          entity_id:
          - switch.lenovo_tablet_motion_detection
      - action: switch.turn_off
        data: {}
        target:
          entity_id:
          - switch.lenovo_tablet_screen
    default:
