        - condition: state
          entity_id: input_select.house_mode
          state: 'Off'
        - condition: state
          entity_id: input_select.house_mode
          state: Sleep
        - condition: state
          entity_id: binary_sensor.notify_home
          state: 'off'
      sequence:
      - device_id: 2ae8ef1981d03f83e4144debe519a697
        domain: number
        entity_id: c1fda8db1584b621a11a335919b54d27
        type: set_value
        value: 100
      - action: number.set_value
        data:
          value: '60'
        target:
          entity_id:
          - number.fire_tablet_screen_off_timer
      - action: switch.turn_off
        data: {}
        target:
          entity_id:
          - switch.fire_tablet_motion_detection
      - action: switch.turn_off
        target:
          entity_id:
          - switch.fire_tablet_screen
        data: {}
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: input_select.house_mode
          state: Night
      sequence:
      - device_id: 2ae8ef1981d03f83e4144debe519a697
        domain: number
        entity_id: c1fda8db1584b621a11a335919b54d27
        type: set_value
        value: 100
      - action: number.set_value
        data:
          value: '60'
        target:
          entity_id:
          - number.fire_tablet_screen_off_timer
      - action: switch.turn_off
        data: {}
        target:
          entity_id:
          - switch.fire_tablet_motion_detection
    default:
    - device_id: 2ae8ef1981d03f83e4144debe519a697
      domain: number
      entity_id: c1fda8db1584b621a11a335919b54d27
      type: set_value
      value: 255
    - action: number.set_value
      data:
        value: '1200'
      target:
        entity_id:
        - number.fire_tablet_screen_off_timer
    - action: switch.turn_on
      data: {}
      target:
        entity_id:
        - switch.fire_tablet_motion_detection
  mode: restart
