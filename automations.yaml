- alias: Tablet Screen Timeout Living Room
  id: '1708474653467'
  description: Keep the living-room tablet screen on with a zero timeout in On, Evening
    and Night modes; use a 120-second screen timeout in other modes.
  triggers:
  - entity_id:
    - input_select.house_mode
    trigger: state
  conditions: []
  actions:
  - if:
    - or:
      - condition: state
        entity_id: input_select.house_mode
        state: 'On'
      - condition: state
        entity_id: input_select.house_mode
        state: Evening
      - condition: state
        entity_id: input_select.house_mode
        state: Night
    then:
    - target:
        entity_id:
        - number.lenovo_tablet_screen_off_timer
      data:
        value: '0'
      action: number.set_value
    - type: turn_on
      device_id: 070256d058f9215d8c746c4242331023
      entity_id: b856d2fd4dd80e2b1d02e391c347fc75
      domain: switch
    else:
    - target:
        entity_id:
        - number.lenovo_tablet_screen_off_timer
      data:
        value: '120'
      action: number.set_value
  mode: single
- alias: Abrir Estores ao Nascer do Sol
  id: '1652141596083'
  description: On workdays between 08:00 and noon, open closed sunrise-enabled shutters
    after sunrise plus 30 minutes or at 08:01. Require positive sun elevation and
    at least 18 hours since the previous run.
  triggers:
  - event: sunrise
    offset: 00:30:00
    trigger: sun
  - at: 08:01:00
    trigger: time
  conditions:
  - condition: time
    after: 08:00:00
    before: '12:00:00'
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: '0'
  - condition: template
    value_template: '{% set hours = 18 %} {% set last = state_attr(this.entity_id,
      ''last_triggered'') %} {{ last is none or (now() - last).total_seconds() > hours
      * 3600 }}

      '
  - condition: state
    entity_id: binary_sensor.workday
    state: 'on'
  actions:
  - data:
      action_to_run: script.cover_open_if_close
      control_switch: open_sunrise
      covers_list:
      - living_room
      - stairs
      - bedroom_henrique
      - bedroom_ricardo
      - master_bedroom
      - bathroom
      - bedroom_rc
      - laundry
      - kitchen
      - office
    action: script.cover_group_action
  mode: single
- alias: Fechar Estores quando chove
  id: '1663526552935'
  description: Run the per-shutter rain-position routine while the house is empty
    and extended-away mode is off. As configured, the numeric trigger checks weather.home's
    precipitation_unit attribute against 70.
  mode: single
  trigger:
  - trigger: numeric_state
    entity_id: weather.home
    attribute: precipitation_unit
    above: 70
  condition:
  - condition: state
    entity_id: binary_sensor.notify_home
    state: 'off'
  - condition: state
    entity_id: input_boolean.extended_away_mode
    state: 'off'
  action:
  - action: script.cover_group_action
    data:
      action_to_run: script.cover_close_when_raining
      control_switch: close_in_rain
      covers_list:
      - living_room
      - stairs
      - bedroom_henrique
      - bedroom_ricardo
      - master_bedroom
      - bathroom
      - bedroom_rc
      - laundry
      - kitchen
      - office
- id: '1651018838807'
  alias: Fechar Estores ao Por do Sol
  description: Close sunset-enabled shutters after sunset while the house is empty
    and extended-away mode is off. Retry at sunset plus one hour and hourly from 20:00
    to 23:00, with a 12-hour run interval.
  triggers:
  - event: sunset
    offset: 00:00:00
    trigger: sun
  - event: sunset
    offset: '1:00:00'
    trigger: sun
  - trigger: time
    at: '20:00:00'
  - trigger: time
    at: '21:00:00'
  - trigger: time
    at: '22:00:00'
  - trigger: time
    at: '23:00:00'
  conditions:
  - condition: state
    entity_id: binary_sensor.notify_home
    state: 'off'
  - condition: template
    value_template: '{% set hours = 12 %} {% set last = state_attr(this.entity_id,
      ''last_triggered'') %} {{ last is none or (now() - last).total_seconds() > hours
      * 3600 }}

      '
  - condition: sun
    after: sunset
  - condition: state
    entity_id: input_boolean.extended_away_mode
    state:
    - 'off'
  actions:
  - data:
      action_to_run: cover.close_cover
      control_switch: close_sunset
      covers_list:
      - living_room
      - stairs
      - bedroom_henrique
      - bedroom_ricardo
      - master_bedroom
      - bathroom
      - bedroom_rc
      - laundry
      - kitchen
      - office
    action: script.cover_group_action
  mode: single
- id: '1703619934344'
  alias: AC Sala - Ajustar durante a refeição
  description: While living-room AC is heating or cooling, select quiet fan mode when
    the dining-table light stays on for ten seconds. Restore the previous fan mode
    after the light stays off for ten seconds or after one hour and 45 minutes.
  triggers:
  - entity_id:
    - light.living_room_table
    from:
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 10
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: climate.living_room
      state: cool
    - condition: state
      entity_id: climate.living_room
      state: heat
  actions:
  - variables:
      current_fan_mode: '{{ state_attr(''climate.living_room'',''fan_mode'') }}'
  - target:
      entity_id: climate.living_room
    data:
      fan_mode: quiet
    action: climate.set_fan_mode
  - wait_for_trigger:
    - entity_id:
      - light.living_room_table
      from: 'on'
      to: 'off'
      for:
        hours: 0
        minutes: 0
        seconds: 10
      trigger: state
    timeout:
      hours: 1
      minutes: 45
      seconds: 0
      milliseconds: 0
  - target:
      entity_id: climate.living_room
    data:
      fan_mode: '{{ current_fan_mode }}'
    action: climate.set_fan_mode
  mode: single
- id: '1665435183140'
  alias: Água Quente - Ligar Manhã (Antes do Nascer do Sol)
  description: Between 06:00 and 08:30, enable the water-heater thermostat when solar-thermal
    heating is inactive and tank-top temperature is below 42 C. Recheck at 06:01 and
    below 40 C; extended-away mode blocks it.
  triggers:
  - at: 06:01:00
    trigger: time
  - entity_id:
    - sensor.temperature_water_heater_top
    below: 40
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: input_boolean.extended_away_mode
    state: 'off'
  - condition: time
    after: 06:00:00
    before: 08:30:00
  actions:
  - condition: state
    entity_id: binary_sensor.water_heater_panel_heating
    state: 'off'
  - condition: numeric_state
    entity_id:
    - sensor.temperature_water_heater_top
    below: 42
  - data: {}
    target:
      entity_id: climate.water_heater
    action: climate.turn_on
  mode: single
- id: '1665435233424'
  alias: Água Quente - Desligar Manhã
  description: At 08:00, 08:30 and 09:30, disable electric water-heater thermostat
    control if weather is sunny, it is a workday without a day off, solar-thermal
    heating is active, or tank-top temperature exceeds 50 C.
  triggers:
  - at: 08:00:00
    trigger: time
  - at: 08:30:00
    trigger: time
  - at: 09:30:00
    trigger: time
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: weather.home
      state: sunny
    - condition: and
      conditions:
      - condition: state
        entity_id: binary_sensor.workday
        state: 'on'
      - condition: state
        entity_id: input_boolean.day_off_work
        state: 'off'
    - condition: state
      entity_id: binary_sensor.water_heater_panel_heating
      state: 'on'
    - condition: numeric_state
      entity_id: sensor.temperature_water_heater_top
      above: 50
  actions:
  - data: {}
    target:
      entity_id: climate.water_heater
    action: climate.turn_off
  mode: single
- alias: Água Quente - Ligar Tarde
  id: '1665435448806'
  description: Enable the water-heater thermostat between 15:00 and 22:00 when solar-thermal
    heating has been inactive for ten minutes and tank-top temperature is below 60
    C. Scheduled and solar-stop triggers recheck eligibility; extended absence and
    a 12-hour run interval apply.
  triggers:
  - event: sunset
    offset: -01:00:00
    trigger: sun
  - at:
    - '15:00:00'
    - '16:00:00'
    - '17:00:00'
    - '18:00:00'
    - '19:00:00'
    - '20:00:00'
    - '21:00:00'
    trigger: time
  - entity_id: binary_sensor.water_heater_panel_heating
    from: 'on'
    to: 'off'
    for:
      minutes: 30
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.extended_away_mode
    state: 'off'
  - condition: time
    after: '15:00:00'
    before: '22:00:00'
  - condition: state
    entity_id: binary_sensor.water_heater_panel_heating
    state: 'off'
    for:
      minutes: 10
  - condition: template
    value_template: '{% set hours = 12 %} {% set last = state_attr(this.entity_id,
      ''last_triggered'') %} {{ last is none or (now() - last).total_seconds() > hours
      * 3600 }}

      '
  - condition: numeric_state
    entity_id: sensor.temperature_water_heater_top
    below: 60
  actions:
  - data: {}
    target:
      entity_id: climate.water_heater
    action: climate.turn_on
  mode: single
- alias: Água Quente - Desligar Presets
  id: '1674085777289'
  description: Reset the water-heater preset to none at 22:30 if another preset is
    selected.
  triggers:
  - at: '22:30:00'
    trigger: time
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.water_heater
      attribute: preset_mode
      state: none
  actions:
  - data:
      preset_mode: none
    target:
      entity_id: climate.water_heater
    action: climate.set_preset_mode
  mode: single
- alias: Água Quente - Modo Conforto Manhã
  id: turn_on_confort_mode_weekens
  description: On non-workdays or a day off, enable comfort heating when someone is
    home, weather is not sunny, solar heating and its pump are inactive, and tank
    temperatures are below 50 C at the top and 30 C at the bottom.
  trigger:
  - trigger: time
    at: '10:30:00'
  - trigger: state
    entity_id:
    - binary_sensor.water_heater_panel_heating
    to: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  - trigger: numeric_state
    entity_id:
    - sensor.temperature_water_heater_top
    below: 50
  condition:
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.workday
      state: 'off'
    - condition: state
      entity_id: input_boolean.day_off_work
      state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: weather.home
      state: sunny
  - condition: state
    entity_id: binary_sensor.notify_home
    state: 'on'
  - condition: state
    entity_id: binary_sensor.water_heater_pump_state
    state: 'off'
  - condition: numeric_state
    entity_id: sensor.temperature_water_heater_bottom
    below: 30
  - condition: state
    entity_id: binary_sensor.water_heater_panel_heating
    state: 'off'
  action:
  - condition: state
    entity_id: binary_sensor.water_heater_panel_heating
    state: 'off'
  - condition: numeric_state
    entity_id:
    - sensor.temperature_water_heater_top
    below: 50
  - action: climate.turn_on
    data: {}
    target:
      entity_id: climate.water_heater
  - action: climate.set_preset_mode
    data:
      preset_mode: comfort
    target:
      entity_id: climate.water_heater
  mode: single
- id: '1701641659897'
  alias: Atualizar Localização
  description: On exterior person/vehicle detection or gate opening, request both
    residents' phone locations up to five times at ten-second intervals while both
    home sensors remain off.
  triggers:
  - entity_id:
    - binary_sensor.backyard_camera_person
    - binary_sensor.backyard_camera_car
    - binary_sensor.front_camera_car
    - binary_sensor.front_camera_person
    - binary_sensor.backyard_camera_reolink_person
    - binary_sensor.backyard_camera_reolink_vehicle
    - binary_sensor.front_camera_reolink_vehicle
    - binary_sensor.front_camera_reolink_person
    from: 'off'
    to: 'on'
    trigger: state
  - entity_id:
    - cover.gate
    to: opening
    trigger: state
  - entity_id:
    - cover.gate
    to: open
    trigger: state
  conditions: []
  actions:
  - repeat:
      while:
      - condition: state
        entity_id: binary_sensor.joao_home
        state: 'off'
      - condition: state
        entity_id: binary_sensor.bianca_home
        state: 'off'
      - condition: template
        value_template: '{{ repeat.index <= 5 }}'
      sequence:
      - parallel:
        - action: script.gps_update_joao
          data: {}
        - action: script.gps_update_bianca
          data: {}
      - delay:
          hours: 0
          minutes: 0
          seconds: 10
          milliseconds: 0
  trace:
    stored_traces: 40
  mode: restart
- alias: Abrir Portão João Chegar a Casa
  id: '1701986636577'
  description: Open the gate and run arrival lighting when Joao approaches within
    200 m or becomes home, while his hysteresis sensor still says away. Require automatic
    opening enabled, walking mode off, and a gate closed for five minutes.
  triggers:
  - entity_id:
    - sensor.distance_home_joao
    for:
      hours: 0
      minutes: 0
      seconds: 2
    below: 200
    trigger: numeric_state
  - entity_id:
    - binary_sensor.joao_home
    from: 'off'
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: binary_sensor.joao_home_with_hysteresis
    state: 'off'
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.joao_home
      state: 'on'
    - condition: and
      conditions:
      - condition: numeric_state
        entity_id: sensor.distance_home_joao
        below: 300
      - condition: state
        entity_id: sensor.distance_home_direction_joao
        state: towards
  - condition: state
    entity_id: input_boolean.walking_routine
    state: 'off'
  - condition: state
    entity_id: cover.gate
    state: closed
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - condition: state
    entity_id: input_boolean.gate_automatic_open
    state: 'on'
  actions:
  - target:
      entity_id: cover.gate
    data: {}
    action: cover.open_cover
  - data: {}
    action: script.lights_arriving_home
  mode: single
- id: '1701640659897'
  alias: Localização - Atualizar Joao
  description: Request Joao's phone location every five seconds while his person entity
    is away, he is moving towards home within 2 km, and walking mode is off.
  triggers:
  - trigger: time_pattern
    seconds: /5
  conditions:
  - condition: state
