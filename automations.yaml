- id: '1771630873804'
  alias: lights_control_kitchen_lights_all_on
  description: Turn the pantry light back off if it comes on while a kitchen LED or
    window light has been on for less than one second, preventing pantry activation
    during a simultaneous kitchen-light switch-on.
  triggers:
  - trigger: light.turned_on
    target:
      entity_id: light.kitchen_pantry
    options:
      behavior: all
  conditions:
  - condition: light.is_on
    target:
      entity_id:
      - light.kitchen_led
      - light.kitchen_window
    options:
      behavior: any
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: light.kitchen_led
          state:
          - 'on'
          for:
            hours: 0
            minutes: 0
            seconds: 1
      - condition: state
        entity_id: light.kitchen_led
        state: 'on'
    - condition: and
      conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: light.kitchen_window
          state:
          - 'on'
          for:
            hours: 0
            minutes: 0
            seconds: 1
      - condition: state
        entity_id: light.kitchen_window
        state: 'on'
  actions:
  - action: light.turn_off
    metadata: {}
    target:
      entity_id: light.kitchen_pantry
    data: {}
  mode: single
- id: '1771632199476'
  alias: Controlar Comando Ligar Luz no Escritório
  description: Override the configured Portuguese light-on commands from the office
