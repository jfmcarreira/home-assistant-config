- id: '1777742920832'
  alias: Água Quente - Apoio Fotovoltaico Desligar
  description: Stop direct photovoltaic water heating after at least ten minutes when
    the thermostat is off and PV falls below 1000 W, tank-top exceeds the solar-excess
    target, or the configured battery/PV-power protection conditions are met.
  triggers:
  - trigger: switch.turned_on
    target:
      entity_id: switch.water_heater
    options:
      for:
        hours: 0
        minutes: 10
        seconds: 0
  - trigger: battery.level_changed
    target:
      entity_id: sensor.deye_inverter_battery
    options:
      threshold:
        type: below
        value:
          active_choice: number
          number: 95
  - trigger: temperature.crossed_threshold
    target:
      entity_id: sensor.temperature_water_heater_top
    options:
      threshold:
        type: above
        value:
          active_choice: entity
          number: 60
          unit_of_measurement: °C
          entity: input_number.water_heater_solar_excess_temperature
  - trigger: power.crossed_threshold
    target:
      entity_id: sensor.deye_inverter_pv_power_average
    options:
      threshold:
        type: below
        value:
          active_choice: number
          unit_of_measurement: W
          number: 1000
      for:
        hours: 0
        minutes: 0
        seconds: 0
  conditions:
  - condition: climate.is_hvac_mode
    target:
      entity_id: climate.water_heater
    options:
      hvac_mode:
      - 'off'
  - condition: switch.is_on
    target:
      entity_id: switch.water_heater
    options:
      behavior: any
      for:
        hours: 0
        minutes: 10
        seconds: 0
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: sensor.deye_inverter_pv_power_average
      below: 1000
    - condition: numeric_state
      entity_id: sensor.temperature_water_heater_top
      above: input_number.water_heater_solar_excess_temperature
    - condition: and
      conditions:
      - condition: numeric_state
        entity_id: sensor.deye_inverter_pv_power_average
        below: 3000
      - condition: numeric_state
        entity_id: sensor.deye_inverter_battery
        below: 95
      - condition: numeric_state
        entity_id: sensor.deye_inverter_battery_power
        below: 1500
  actions:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.water_heater
    data: {}
  mode: single
