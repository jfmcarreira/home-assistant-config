      behavior: each
      for:
        hours: 0
        minutes: 0
        seconds: 0
      threshold:
        type: above
        value:
          active_choice: number
          unit_of_measurement: W
          number: 2000
  conditions:
  - condition: switch.is_off
    target:
      entity_id: switch.deye_inverter_solar_sell
    options:
      behavior: any
      for: 00:00:00
  - condition: battery.is_level
    target:
      entity_id: sensor.deye_inverter_battery
    options:
      threshold:
        type: above
        value:
          active_choice: number
          number: 50
  - condition: time
    before: '17:00:00'
  - condition: or
    conditions:
    - condition: battery.is_level
      target:
        entity_id: sensor.deye_inverter_battery
      options:
        threshold:
          type: above
          value:
            active_choice: number
            number: 95
    - condition: numeric_state
      entity_id: sensor.solar_forecast_today_remaining
      above: 25
  actions:
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.deye_inverter_solar_sell
    data: {}
  - if:
    - condition: battery.is_level
      target:
        entity_id: sensor.deye_inverter_battery
      options:
        threshold:
          type: below
          value:
            active_choice: number
            number: 90
    then:
    - action: number.set_value
      metadata: {}
      target:
        entity_id: number.deye_inverter_maximum_battery_charge_current
      data:
        value: '40'
  mode: single
- id: '1787434704097'
  alias: 'Estores - Limpar a Última Acção '
  description: Mark a monitored shutter's last action as Manualmente on any state
    or attribute change. Stairs use an input_select; other shutters use ESPHome select
    entities, which group workers overwrite with their action reason after ten seconds.
  triggers:
  - trigger: state
    entity_id:
    - cover.kitchen
    - cover.living_room
    - cover.laundry
    - cover.bedroom_rc
    - cover.bathroom
    - cover.office
    - cover.stairs
    - cover.master_bedroom
    - cover.bedroom_ricardo
    - cover.bedroom_henrique
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''cover.stairs'' }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.cover_stairs_last_action
        data:
          option: Manualmente
    default:
    - action: select.select_option
      target:
        entity_id: select.cover_{{ trigger.entity_id.split('.')[1] }}_last_action
      data:
        option: Manualmente
  mode: parallel
- id: '1788465709338'
  alias: cctv_vision_front_garden
  description: Use the external event-summary blueprint to summarize front-garden
    person detections while the house is empty and deliver consolidated notifications
    to Joao's phone. The analysis prompt requests concise European Portuguese observations.
  use_blueprint:
    path: valentinfrlch/event_summary.yaml
    input:
      camera_entities:
      - camera.front
      motion_sensors:
      - binary_sensor.frigate_zone_front_garden_person
      provider: 01M1MJWSYWNG2741GD56NMKXTD
      model: ''
      message: 'Resume o evento observado de forma curta, objetiva e em português
        de Portugal. Foca-te apenas em pessoas, animais, veículos e outros elementos
        em movimento. Descreve ações, deslocações e interações relevantes, ignorando
        cenário e objetos estáticos.

        Apresenta tudo como observação direta. Nunca menciones imagens, frames, capturas
        ou o processo de análise.

        Não especules nem acrescentes detalhes irrelevantes. Se houver atividade,
        descreve apenas o que aconteceu.


        Se não houver atividade relevante, responde exatamente:

        "Nenhuma atividade observada."'
      notify_device:
      - 41985ed9029605740a11629268909bad
      notification_delivery: Consolidated
      notification_time: at {{ now().strftime("%H:%M") }}
      tap_navigate: /lovelace-subviews/dashboard-cctv
      run_conditions:
      - condition: occupancy.is_not_detected
        target:
          entity_id: binary_sensor.notify_home
        options:
          behavior: any
          for: 00:00:00
- id: '1789252945598'
  alias: 'Parar routinas de fechar o portão '
  description: Stop the sensor-based and kitchen-door-based gate auto-close scripts
    when the gate reports closed.
  triggers:
  - trigger: gate.closed
    target:
      entity_id: cover.gate
    options:
      for: 00:00:00
  conditions: []
  actions:
  - action: script.turn_off
    metadata: {}
    target:
      entity_id:
      - script.routine_gate_open_auto_close_sensors
      - script.routine_gate_open_auto_close_kitchen_door
    data: {}
  mode: single
- id: '1789490148687'
  alias: cctv_frigate_mode
  description: Select Frigate profile home in On or Evening mode, armed_home in Night
    or Sleep, and armed otherwise. Recheck on house-mode or household-presence changes.
  triggers:
  - trigger: state
    entity_id: sensor.house_mode
  - trigger: state
    entity_id: binary_sensor.notify_home
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.house_mode
        state:
        - Evening
        - 'On'
      sequence:
      - action: select.select_option
        metadata: {}
        target:
          entity_id: select.frigate_profile
        data:
          option: home
    - conditions:
      - condition: state
        entity_id: input_select.house_mode
        state:
        - Sleep
        - Night
      sequence:
      - action: select.select_option
        metadata: {}
        target:
          entity_id: select.frigate_profile
        data:
          option: armed_home
    default:
    - action: select.select_option
      metadata: {}
      target:
        entity_id: select.frigate_profile
      data:
        option: armed
  mode: single
