- id: '1696854410563'
  alias: Desumidificador - Ajustar valor
  description: Raise the dehumidifier humidity setpoint to the outdoor average when
    that average is more than five percentage points above the current setpoint. This
    rule does not lower the setpoint.
  triggers:
  - entity_id:
    - sensor.humidity_outside_average
    to:
    trigger: state
  conditions:
  - condition: template
    value_template: '{% set difference = states(''sensor.humidity_outside_average'')
      | float - state_attr(''humidifier.portable_dehumidifier'', ''humidity'') %}
      {{ is_number(difference) and difference | float > 5 }}'
  actions:
  - data:
      humidity: '{{ states(''sensor.humidity_outside_average'') }}'
    target:
      entity_id: humidifier.portable_dehumidifier
    action: humidifier.set_humidity
  mode: single
