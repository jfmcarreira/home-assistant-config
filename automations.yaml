        state: 'off'
      - condition: state
        entity_id: light.doorway
        state: 'off'
      - condition: state
        entity_id: light.hallway
        state: 'off'
      - condition: state
        entity_id: light.living_room_group
        state: 'off'
      - condition: state
        entity_id: light.stairs_down
        state: 'off'
