    to:
    for:
      hours: 0
      minutes: 10
      seconds: 0
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: switch.living_room_tv
      state:
      - 'off'
      for:
        hours: 0
        minutes: 10
        seconds: 0
    - condition: state
      entity_id: switch.living_room_tv
      state:
      - 'on'
      for:
        hours: 0
        minutes: 10
        seconds: 0
  - condition: not
    conditions:
    - condition: state
      entity_id: media_player.living_room_tv
      state:
      - 'on'
