- alias: Desligar Tudo se a Casa Estiver Vazia
  id: '1651441102640'
  description: Run the house-wide shutdown after household presence has been off for
    30 minutes, unless extended-away mode is enabled.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.notify_home
    from: 'on'
    to: 'off'
    for:
      hours: 0
      minutes: 30
      seconds: 0
  conditions:
  - condition: state
    entity_id: binary_sensor.notify_home
    state: 'off'
  - condition: state
    entity_id: input_boolean.extended_away_mode
    state: 'off'
  actions:
  - data: {}
    action: script.house_turn_all_off
  mode: single
- alias: Sincronizar Luzes do Hall
  id: '1652213927460'
  description: Turn off the upstairs hall and side lights together when either is
    switched off; switching one on does not turn on the other.
  use_blueprint:
    path: lights/sync_lights.yaml
    input:
      master_light: light.hall
      slave_light: light.hall_side
      sync_exclusive: false
      sync_on: false
      sync_off: true
      sync_off_from_slave: true
- alias: Controlo da Luz da Despensa com a Porta
  id: '1653347146334'
  description: Keep the pantry light on while its door sensor is on, and turn it off
    on other door-state changes. This control is independent of house mode.
  trigger:
  - trigger: state
    entity_id:
    - binary_sensor.kitchen_pantry_door
  condition: []
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.kitchen_pantry_door
        state: 'on'
      sequence:
      - action: light.turn_on
        data: {}
        target:
          entity_id: light.kitchen_pantry
    default:
    - action: light.turn_off
      data: {}
      target:
        entity_id: light.kitchen_pantry
  mode: single
- id: '1653354558079'
  alias: Lights Turn On Exterior With Kitchen Door
  description: Light the rear exterior when the kitchen door opens at night and the
    rear light is off. Wait up to two hours for the door to close or the rear light
    to go off; if the kitchen-door light is still on, allow one further minute before
    switching off the rear light.
  triggers:
  - entity_id:
    - binary_sensor.kitchen_door
    from: 'off'
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: light.exterior_wall_back
    state: 'off'
  - condition: state
    entity_id: binary_sensor.night
    state: 'on'
  actions:
  - data: {}
    target:
      entity_id: light.exterior_wall_back
    action: light.turn_on
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.kitchen_door
      to: 'off'
      trigger: state
    - entity_id:
      - light.exterior_wall_back
      to: 'off'
      trigger: state
    timeout:
      hours: 2
      minutes: 0
      seconds: 0
      milliseconds: 0
  - condition: state
    entity_id: light.kitchen_door
    state: 'on'
  - wait_for_trigger:
    - entity_id:
      - light.exterior_wall_back
      to: 'off'
      trigger: state
    timeout: 00:01:00
  - condition: state
    entity_id: light.exterior_wall_back
    state: 'on'
  - data: {}
    target:
      entity_id:
      - light.exterior_wall_back
    action: light.turn_off
  mode: single
- alias: Lights Turn On Kitchen Light
  id: '1653947527310'
  description: Turn on the kitchen LED when the kitchen door opens with sun elevation
    below 5 degrees. No automatic switch-off is performed here.
  trigger:
  - trigger: state
    entity_id:
    - binary_sensor.kitchen_door
    from: 'off'
    to: 'on'
  condition:
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: '5'
  action:
  - action: light.turn_on
    data: {}
    target:
      entity_id: light.kitchen_led
  mode: single
- alias: Tarefa Máquina de Lavar Roupa
  id: '1655079401495'
  description: Record washing-cycle completion and energy usage, then record clothes
    removal when the door opens or the task is acknowledged. Mobile finish reminders
    are disabled for this instance.
  use_blueprint:
    path: tasks/machine_two_steps_task.yaml
    input:
      machine_sensor: binary_sensor.washing_machine_state
      machine_door_sensor: binary_sensor.washing_machine_door
      machine_energy_sensor: sensor.device_energy_washing_machine
      task_needs_attention: binary_sensor.wash_machine_wet_clothes
      task_done_door_time: 0
      task_machine_code_name: Washing_Machine_Wash_Clothes
      task_done_code_name: Washing_Machine_Clothes_Off
      machine_finish_message: A máquina da roupa terminou. Pode retirar a roupa
      send_notification: false
      notification_action: Roupa Retirada
      android_task_id: 20
      notification_action_id: washing_machine_clothes_off
- id: '1655462775855'
  alias: Tarefa do Filtro da Água
  description: Track water-filter replacement, remind residents at home before 21:00
    when replacement is due, and consume one filter from Grocy stock when completion
    is recorded.
  use_blueprint:
    path: tasks/tracked_tasks.yaml
    input:
      task_needs_attention: binary_sensor.water_filter_needs_replacement
      task_sensor: sensor.water_filter_replacement_last_done
      task_done_code_name: Water_Filter_Replacement
      send_notification: true
      notification_max_time: '21:00:00'
      notification_message: O Filtro da Água Necessita de Substuição
      notification_action: Filtro Substituido
      task_extra_actions:
      - action: grocy.consume_product_from_stock
        data:
          product_id: '99'
          amount: 1
          transaction_type: CONSUME
- alias: Tarefa da Máquina de Secar
  id: '1655496730769'
  description: Record dryer-cycle completion and energy usage, then mark emptying
    when the door opens or the task is acknowledged. Mobile finish reminders are disabled
    for this instance.
  use_blueprint:
    path: tasks/machine_two_steps_task.yaml
    input:
      machine_sensor: binary_sensor.dryer_machine_state
      machine_door_sensor: binary_sensor.dryer_machine_door
      machine_energy_sensor: sensor.device_energy_dryer_machine
      task_needs_attention: binary_sensor.dryer_machine_need_emtpy
      task_machine_code_name: Dryer_Machine_Clean
      task_done_code_name: Dryer_Machine_Empty
      machine_finish_message: Máquina de Secar Terminou. Pode Retirar a Roupa!
      notification_action: Roupa Retirada
      send_notification: false
      android_task_id: 21
      notification_action_id: dryer_machine_clothes_off
      task_done_door_time: 0
- alias: Sincronizar Luzes da Cozinha
  id: '1656374052136'
  description: Switch off the kitchen LED and window lights together when either is
    switched off, without synchronizing their switch-on actions.
  use_blueprint:
    path: lights/sync_lights.yaml
    input:
      master_light: light.kitchen_led
      slave_light: light.kitchen_window
      sync_exclusive: false
      sync_on: false
      sync_off: true
      sync_off_from_slave: true
- alias: Controlar Luz da Sala Day/Night
  id: '1657064426365'
  description: Apply the living-room night or day lighting scene when the window light
    turns on, according to binary_sensor.night_mode.
  trigger:
  - trigger: state
    entity_id:
    - light.living_room_window
    from: 'off'
    to: 'on'
  condition: []
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.night_mode
        state: 'on'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.lights_living_room_night
        metadata: {}
    default:
    - action: scene.turn_on
      target:
        entity_id: scene.lights_living_room_day
      metadata: {}
  mode: single
- alias: Luzes por Mov. nas Escadas
  id: '1657408193240'
  description: Use stair motion to light the wall below 50 lux in On or Evening mode,
    with a 30-second no-motion timeout. Sleep blocks activation; manually lit stairs
    are protected by the shared motion-light controller.
  use_blueprint:
    path: lights/motion_based_lights_v3.yaml
    input:
      motion_sensor: binary_sensor.motion_sensor_stairs
      target_entity: light.stairs_wall
      no_motion_wait: 30
      illuminance_sensor: sensor.light_stairs_top
      illuminance_cutoff: 50
      only_after_sunset: false
      disable_in_guest: false
      blocker_on_entity: light.stairs_group
      required_house_mode: Dia+Anoitecer
      room_name: Stairs
      disable_in_sleep: true
      presence_sensor: none
- id: '1657981029516'
  alias: Activar Rotina de Chegar a Casa
  description: Start arrival lighting at night when Joao or Bianca returns, or a gate-area
    camera detects a vehicle while someone is still considered away by the hysteresis
    sensors. Do not start an already-running arrival script.
  triggers:
  - id: joao_trigger
    entity_id:
    - binary_sensor.joao_home
    from: 'off'
    to: 'on'
    trigger: state
  - id: bianca_trigger
    entity_id:
    - binary_sensor.bianca_home
    from: 'off'
    to: 'on'
    trigger: state
  - id: car_trigger
    entity_id:
    - binary_sensor.front_camera_reolink_vehicle
    - binary_sensor.driveway_camera_reolink_vehicle
    - binary_sensor.frigate_zone_front_gate_car
    - binary_sensor.frigate_zone_driveway_gate_car
    from:
    - 'off'
    trigger: state
  conditions:
  - condition: state
    entity_id: script.lights_arriving_home
    state:
    - 'off'
  - condition: state
    entity_id: binary_sensor.night
    state: 'on'
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: template
        value_template: '{{ trigger.id == ''car_trigger'' }}'
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.joao_home_with_hysteresis
          state: 'off'
        - condition: state
          entity_id: binary_sensor.bianca_home_with_hysteresis
          state: 'off'
    - condition: and
      conditions:
      - condition: state
        entity_id: binary_sensor.joao_home_with_hysteresis
        state: 'off'
      - condition: template
        value_template: '{{ trigger.id == ''joao_trigger'' }}'
    - condition: and
      conditions:
      - condition: state
        entity_id: binary_sensor.bianca_home_with_hysteresis
        state: 'off'
      - condition: template
        value_template: '{{ trigger.id == ''bianca_trigger'' }}'
  actions:
  - action: script.turn_on
    target:
      entity_id: script.lights_arriving_home
  mode: restart
- alias: Controlar Luz da Cozinha Day/Night
  id: '1658004941042'
  description: Apply the kitchen day or night scene whenever the kitchen LED turns
    on, using binary_sensor.night_mode to select the lighting level.
  trigger:
  - trigger: state
    entity_id:
    - light.kitchen_led
    from: 'off'
    to: 'on'
  condition: []
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.night_mode
        state: 'on'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.lights_kitchen_night
        metadata: {}
    default:
    - action: scene.turn_on
      target:
        entity_id: scene.lights_kitchen_day
      metadata: {}
  mode: single
- id: '1658177571375'
  alias: Tarefa da Máquina de Lavar a Loiça
  description: Record dishwasher completion and energy usage, remind residents at
    home to empty it, and mark emptying after its door stays open for two minutes
    or the notification is acknowledged.
  use_blueprint:
    path: tasks/machine_two_steps_task.yaml
    input:
      machine_sensor: binary_sensor.dish_wash_machine_state
      machine_door_sensor: binary_sensor.dish_wash_machine_door
      machine_energy_sensor: sensor.device_energy_dish_wash_machine
      task_needs_attention: binary_sensor.dish_wash_machine_clean
      task_machine_code_name: Dish_Wash_Clean
      task_done_code_name: Dish_Wash_Empty
      machine_finish_message: A máquina de lavar loiça terminou. Pode retirar a loiça
      android_task_id: 22
      send_notification: true
      notification_action: Loiça Retirada
      notification_action_id: task_dish_wash_empty
      task_done_door_time: 2
      task_extra_actions: []
- alias: 'Desligar Luzes da Despensa com Temporizador '
  id: '1659187275200'
  description: Switch off the pantry light after it has been on for 30 minutes, provided
    kitchen motion has been clear for at least two minutes.
  triggers:
  - type: turned_on
    device_id: 157313d13fb325a54a0135d57c4b348d
    entity_id: light.kitchen_pantry
    domain: light
    for:
      hours: 0
      minutes: 30
      seconds: 0
    trigger: device
  conditions:
  - condition: state
    entity_id: binary_sensor.motion_sensor_kitchen
    state: 'off'
    for:
      hours: 0
      minutes: 2
      seconds: 0
  actions:
  - type: turn_off
    device_id: 157313d13fb325a54a0135d57c4b348d
    entity_id: light.kitchen_pantry
    domain: light
  mode: single
- id: '1661088354800'
  alias: Fechar Estores Fachada Poente
  description: Close heat-enabled kitchen and master-bedroom shutters when the house
    is empty without guests, outside temperature exceeds 25 C, sun azimuth is west
    of 179 degrees, elevation exceeds 20 degrees, and the weather state permits it.
  triggers:
  - entity_id:
    - sensor.temperature_outside
    for:
      hours: 0
      minutes: 15
      seconds: 0
    above: 25
    trigger: numeric_state
  - entity_id:
    - sun.sun
    for:
      hours: 0
      minutes: 0
      seconds: 0
    above: 180
    attribute: azimuth
    trigger: numeric_state
  - entity_id: sun.sun
    for:
      hours: 0
      minutes: 30
      seconds: 0
    above: 180
    attribute: azimuth
    trigger: numeric_state
  - entity_id:
    - sun.sun
    for:
      hours: 1
      minutes: 0
      seconds: 0
    above: 180
    attribute: azimuth
    trigger: numeric_state
  - trigger: state
    entity_id:
    - binary_sensor.notify_home
    to: 'off'
    from: 'on'
    for:
      hours: 0
      minutes: 30
      seconds: 0
  conditions:
  - condition: numeric_state
    entity_id: sensor.temperature_outside
    above: 25
  - condition: state
    entity_id: binary_sensor.notify_home
    state: 'off'
  - condition: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: 179
  - condition: state
    entity_id: binary_sensor.house_guest
    state: 'off'
  - condition: numeric_state
    entity_id: sensor.sun_solar_elevation
    above: 20
  - condition: state
    entity_id: weather.home
    state:
    - sunny
    - clear-night
    - exceptional
    - unknown
    - unavailable
  actions:
  - data:
      action_to_run: cover.close_cover
      control_switch: close_with_heat
      covers_list:
      - master_bedroom
      - kitchen
    action: script.cover_group_action
  mode: single
- id: '1661120403152'
  alias: Abrir Estores da Suite Fim de Semana
  description: Open the closed master-bedroom shutter at 10:00 on non-workdays or
    a declared day off, unless extended-away mode is enabled.
  triggers:
  - trigger: time_pattern
    hours: '10'
    minutes: '00'
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.workday
      state: 'off'
    - condition: switch.is_on
      target:
        entity_id: input_boolean.day_off_work
      options:
        behavior: any
        for: 00:00:00
  - condition: state
    entity_id: cover.master_bedroom
    state: closed
  - condition: state
    entity_id: input_boolean.extended_away_mode
    state: 'off'
  actions:
  - action: cover.open_cover
    data: {}
    target:
      entity_id: cover.master_bedroom
  mode: single
- id: '1661196402455'
  alias: Fechar Estores Fachada Sul
  description: Between 10:00 and 16:00, close heat-enabled stairs, ground-floor bedroom
    and laundry shutters above 25 C while the house is empty, without guests or extended-away
    mode.
  triggers:
  - hours: '10'
    minutes: '00'
    seconds: '00'
    trigger: time_pattern
  - hours: '10'
    minutes: '30'
    seconds: '00'
    trigger: time_pattern
  - entity_id:
    - sensor.temperature_outside
    for:
      hours: 0
      minutes: 30
      seconds: 0
    above: 25
    trigger: numeric_state
  - trigger: state
    entity_id:
    - binary_sensor.notify_home
    to: 'off'
    from: 'on'
    for:
      hours: 0
      minutes: 30
      seconds: 0
  conditions:
  - condition: numeric_state
    entity_id: sensor.temperature_outside
    above: 25
  - condition: time
    after: '10:00:00'
    before: '16:00:00'
  - condition: state
    entity_id: binary_sensor.notify_home
    state: 'off'
  - condition: state
    entity_id: binary_sensor.house_guest
    state: 'off'
  - condition: state
    entity_id: input_boolean.extended_away_mode
    state: 'off'
  actions:
  - data:
      action_to_run: cover.close_cover
      control_switch: close_with_heat
      covers_list:
      - stairs
      - bedroom_rc
      - laundry
    action: script.cover_group_action
  mode: single
- alias: Luzes por Mov. no Escritório
  id: '1661643560066'
  description: Automatically light the office below 10 lux while someone is home,
    except during Sleep. Wait ten seconds after motion clears; notify the ESPHome
    button controller to prevent a double toggle when automatic lighting starts.
  use_blueprint:
    path: lights/motion_based_lights_v3.yaml
    input:
      motion_sensor: binary_sensor.motion_sensor_office
      target_entity: light.office
      min_repetition_interval_sec: 0
      illuminance_sensor: sensor.light_office
      illuminance_cutoff: 10
      only_after_sunset: false
      disable_in_guest: false
      required_house_mode: Todos
      room_name: Escritório
      blocker_on_entity: light.office
      disable_in_sleep: true
      presence_sensor: none
      no_motion_wait: 10
      disable_switch_button: button.shelly25_lights_office_auto_on
- alias: Trigger Botões da Cama da Suite
  id: '1665241197738'
  description: Short bedside presses toggle the corresponding master-bedroom bed light.
    A long press turns on the bedroom if the monitored upstairs lights are all off;
    otherwise it switches off the configured upstairs areas.
  triggers:
  - device_id: 0917b5ae15c6e0fb6aa33f8f6a9fc492
    domain: shelly
    type: long_push
    subtype: button1
    id: first_long
    trigger: device
  - device_id: 0917b5ae15c6e0fb6aa33f8f6a9fc492
    domain: shelly
    type: long_push
    subtype: button2
    id: second_long
    trigger: device
  - device_id: 0917b5ae15c6e0fb6aa33f8f6a9fc492
    domain: shelly
    type: single_push
    subtype: button1
    id: first_short
    trigger: device
  - device_id: 0917b5ae15c6e0fb6aa33f8f6a9fc492
    domain: shelly
    type: single_push
    subtype: button2
    id: second_short
    trigger: device
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: first_long
        - condition: trigger
          id: second_long
      sequence:
      - if:
        - condition: state
          state: 'off'
          entity_id:
          - light.master_bedroom
          - light.master_bedroom_bathroom
          - light.hall_group
          - light.stairs_group
        then:
        - data: {}
          target:
            entity_id:
            - light.master_bedroom
          action: light.turn_on
        else:
        - data: {}
          target:
            area_id:
            - hall
            - bathroom_main
            - master_bedroom_bathroom
            - master_bedroom
          action: light.turn_off
      alias: Long Press
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: first_short
      sequence:
      - data: {}
        target:
          entity_id: light.master_bedroom_bed_window
        action: light.toggle
      alias: Left Short
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: second_short
      sequence:
      - data: {}
        target:
          entity_id: light.master_bedroom_bed_wall
        action: light.toggle
      alias: Right Short
  mode: single
- id: '1668971106955'
  alias: Desligar Coluna do Hall com as Luzes
  description: Stop playback on the upstairs hall speaker when the hall light group
    turns off.
  triggers:
  - entity_id:
    - light.hall_group
    from: 'on'
    to: 'off'
    trigger: state
  conditions: []
  actions:
  - action: media_player.media_stop
    metadata: {}
    target:
      entity_id: media_player.ghm_hall
    data: {}
  mode: single
- id: Lights Xmas Auto On
  alias: Ligar Luzes da Arvore de Natal Tarde
  description: Turn on the Christmas tree when someone is home, sun elevation is below
    15 degrees, and the time is between 16:00 and 23:30. Recheck on arrival and when
    elevation crosses the threshold.
  triggers:
  - entity_id: binary_sensor.notify_home
    to: 'on'
    trigger: state
  - trigger: numeric_state
    entity_id:
    - sensor.sun_solar_elevation
    below: 15
  conditions:
  - condition: template
    value_template: '{{ state_attr("sun.sun", "elevation") < 15 }}'
  - condition: state
    entity_id: binary_sensor.notify_home
    state: 'on'
  - condition: time
    after: '16:00:00'
    before: '23:30'
  actions:
  - entity_id: light.xmas_tree
    action: light.turn_on
  mode: restart
- id: Lights Xmas Auto Off
  alias: Desligar Luzes de Natal
  description: Switch off the seasonal Christmas-tree light every day at 02:00.
  triggers:
  - at: 02:00:00
    trigger: time
  actions:
  - data: {}
    entity_id: light.xmas_tree
    action: light.turn_off
  mode: restart
- id: '1669853123196'
  alias: Luzes por Mov. na Cozinha
  description: Light the kitchen on motion below 50 lux, with a 30-second no-motion
    timeout. Guest and Sleep modes block activation; a repeat within ten seconds can
    keep automatic lighting on.
  use_blueprint:
    path: lights/motion_based_lights_v3.yaml
    input:
      motion_sensor: binary_sensor.motion_sensor_kitchen
      target_entity: light.kitchen
      min_repetition_interval_sec: 10
      illuminance_sensor: sensor.light_kitchen
      illuminance_cutoff: 50
      only_after_sunset: 'off'
      disable_in_guest: true
      required_house_mode: Todos
      room_name: Cozinha
      blocker_on_entity: light.kitchen
      disable_in_sleep: true
      presence_sensor: none
      no_motion_wait: 30
- alias: Termoventilador - Desligar Automáticamente
  id: '1669853572469'
  description: Turn off both the portable-heater thermostat and its power switch when
    the selected bathroom's lights go out, or after one hour of continuous switch
    operation.
  trigger:
  - trigger: state
    entity_id:
    - light.main_bathroom
    from: 'on'
    to: 'off'
    id: lights_off_main
  - trigger: state
    entity_id:
    - light.master_bedroom_bathroom
    from: 'on'
    to: 'off'
    id: lights_off_master
  - trigger: state
    entity_id:
    - switch.portable_heater
    to: 'on'
    for:
      hours: 1
      minutes: 0
      seconds: 0
    id: timeout
  condition:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: state
        entity_id: input_select.portable_heater_location
        state: Casa de Banho Principal
      - condition: trigger
        id:
        - lights_off_main
    - condition: and
      conditions:
      - condition: state
        entity_id: input_select.portable_heater_location
        state: Casa de Banho da Suite
      - condition: trigger
        id:
        - lights_off_master
    - condition: trigger
      id:
      - timeout
  action:
  - action: climate.turn_off
    data: {}
