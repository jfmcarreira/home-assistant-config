- id: '1779033865434'
  alias: Fechar Estores dos Quartos ao Por do Sol
  description: Close sunset-enabled shutters in the three upstairs bedrooms when sun
    elevation drops below 3 degrees, someone is home and extended-away mode is off.
    Limit runs to at least 12 hours apart.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.sun_solar_elevation
    below: 3
  conditions:
  - condition: state
    entity_id: binary_sensor.notify_home
    state:
    - 'on'
  - condition: template
    value_template: '{% set hours = 12 %} {% set last = state_attr(this.entity_id,
      ''last_triggered'') %} {{ last is none or (now() - last).total_seconds() > hours
      * 3600 }}

      '
  - condition: state
    entity_id: input_boolean.extended_away_mode
    state:
    - 'off'
  actions:
  - data:
      action_to_run: cover.close_cover
      control_switch: close_sunset
      covers_list:
      - bedroom_henrique
      - bedroom_ricardo
      - master_bedroom
    action: script.cover_group_action
  mode: single
- id: '1779568047844'
  alias: Abrir Estores Fechados com o Calor
  description: Between 16:00 and 20:30, reopen the configured non-west shutters only
    if closed with last action Sol and either outside temperature or sun elevation
    is below 25. Require an empty house without guests or extended absence and an
    18-hour run interval.
  triggers:
  - entity_id:
    - sensor.temperature_outside
    for:
      hours: 0
      minutes: 30
      seconds: 0
    trigger: numeric_state
    below: 25
  - trigger: state
    entity_id:
    - binary_sensor.notify_home
    to: 'off'
    from: 'on'
    for:
      hours: 0
      minutes: 30
      seconds: 0
  - trigger: numeric_state
    entity_id:
    - sensor.sun_solar_elevation
    below: 25
  conditions:
  - condition: time
    after: '16:00:00'
    before: '20:30:00'
  - condition: template
    value_template: '{% set hours = 18 %} {% set last = state_attr(this.entity_id,
      ''last_triggered'') %} {{ last is none or (now() - last).total_seconds() > hours
      * 3600 }}

      '
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: sensor.temperature_outside
      below: 25
    - condition: numeric_state
      entity_id: sensor.sun_solar_elevation
      below: 25
  - condition: state
    entity_id: binary_sensor.notify_home
    state: 'off'
  - condition: state
    entity_id: binary_sensor.house_guest
    state: 'off'
  - condition: state
    entity_id: input_boolean.extended_away_mode
    state: 'off'
  actions:
  - data:
      action_to_run: script.cover_open_if_close_with_heat
      control_switch: close_with_heat
      covers_list:
      - stairs
      - bedroom_rc
      - laundry
      - living_room
      - office
      - bathroom
      - bedroom_ricardo
      - bedroom_henrique
    action: script.cover_group_action
  mode: single
