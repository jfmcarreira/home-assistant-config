- id: '1658360353381'
  alias: Tablet Control Motion Detection Living Room
  description: Disable living-room tablet motion detection and its screen when the
    house is empty or mode is Off or Sleep. Otherwise enable motion detection without
    explicitly switching the screen on.
  triggers:
  - entity_id:
    - input_select.house_mode
