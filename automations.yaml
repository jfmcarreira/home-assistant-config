- id: '1723936636115'
  alias: Ar Condicionado - Notificar Janelas Abertas Quartos
  description: Alert when any configured upstairs AC is heating or cooling and an
    upstairs monitored window is open. Recheck on sustained AC/window changes and
    limit alerts to one per hour; the open window need not belong to the active unit's
    room.
  triggers:
  - entity_id:
    - climate.master_bedroom
    - climate.bedroom_ricardo
    - climate.bedroom_henrique
    - climate.hall
    to:
    for:
      hours: 0
      minutes: 5
      seconds: 0
    from:
    trigger: state
  - entity_id:
    - binary_sensor.window_main_bathroom
    - binary_sensor.window_master_bedroom
    - binary_sensor.window_bedroom_ricardo
    - binary_sensor.window_bedroom_henrique
    from: 'off'
    to: 'on'
    for:
      hours: 0
      minutes: 10
      seconds: 0
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: climate.hall
      state: cool
    - condition: state
      entity_id: climate.master_bedroom
      state: cool
    - condition: state
      entity_id: climate.bedroom_ricardo
      state: cool
    - condition: state
      entity_id: climate.bedroom_henrique
      state: cool
    - condition: state
      entity_id: climate.hall
      state: heat
    - condition: state
      entity_id: climate.master_bedroom
      state: heat
    - condition: state
      entity_id: climate.bedroom_ricardo
      state: heat
    - condition: state
      entity_id: climate.bedroom_henrique
      state: heat
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.window_main_bathroom
      state: 'on'
    - condition: state
      entity_id: binary_sensor.window_bedroom_henrique
      state: 'on'
    - condition: state
      entity_id: binary_sensor.window_master_bedroom
      state: 'on'
    - condition: state
      entity_id: binary_sensor.window_bedroom_ricardo
      state: 'on'
  - condition: template
    value_template: '{% set hours = 1 %} {% set last = state_attr(this.entity_id,
      ''last_triggered'') %} {{ last is none or (now() - last).total_seconds() > hours
      * 3600 }}

      '
  actions:
  - data:
      title: Equipamentos
      message: Ar Condicionado Ligado nos Quartos com Janelas Abertas
      data:
        priority: high
        persistent: false
        channel: Home
        sticky: false
        clickAction: /lovelace-subviews/dashboard-ac
    action: notify.mobile_app_all
  mode: single
- id: '1723937695759'
  alias: Ar Condicionado - Notificar Janelas Abertas Sala
  description: Alert when living-room or office AC is heating or cooling with a laundry
    or living-room window open. Other door and cover changes can trigger a recheck,
    but do not alone satisfy the open-window condition.
  triggers:
  - entity_id:
    - climate.living_room
    - climate.office
    to:
    for:
      hours: 0
      minutes: 1
      seconds: 0
    from:
    trigger: state
  - entity_id:
    - cover.living_room
    from:
    - open
    to:
    - closed
    for:
      hours: 0
      minutes: 10
      seconds: 0
    trigger: state
  - entity_id:
    - binary_sensor.window_laundry
    - binary_sensor.window_living_room
    - binary_sensor.kitchen_door
    - binary_sensor.front_door
    from: 'off'
    to: 'on'
    for:
      hours: 0
      minutes: 10
      seconds: 0
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: climate.living_room
      state: cool
    - condition: state
      entity_id: climate.office
      state: cool
    - condition: state
      entity_id: climate.living_room
      state: heat
    - condition: state
      entity_id: climate.office
      state: heat
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.window_laundry
      state: 'on'
    - condition: state
      entity_id: binary_sensor.window_living_room
      state: 'on'
  actions:
  - data:
      title: Equipamentos
      message: Ar Condicionado Ligado no R/C com Janelas Abertas
      data:
        priority: high
        persistent: false
        channel: Home
        sticky: false
        clickAction: /lovelace-subviews/dashboard-ac
    action: notify.mobile_app_all
  mode: single
- alias: lights_turn_on_kitchen_led_switch
