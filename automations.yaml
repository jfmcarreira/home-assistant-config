- id: '1776213882859'
  alias: Água Quente - Ligar Manhã Pessoas em Casa
  description: Between 09:30 and noon, enable the water-heater thermostat when someone
    is home, tank-top temperature is below 50 C and solar-thermal heating is inactive.
    Extended-away mode blocks it and runs must be at least 12 hours apart.
  triggers:
  - at: 09:31:00
    trigger: time
  - entity_id:
    - binary_sensor.water_heater_panel_heating
    to:
    - 'off'
    for:
      hours: 1
      minutes: 0
      seconds: 0
    trigger: state
  - entity_id:
    - sensor.temperature_water_heater_top
    below: 50
    trigger: numeric_state
  - trigger: occupancy.detected
    target:
      entity_id: binary_sensor.notify_home
    options: {}
  conditions:
  - condition: state
    entity_id: input_boolean.extended_away_mode
    state: 'off'
  - condition: time
    after: 09:30:00
    before: '12:00:00'
  - condition: occupancy.is_detected
    target:
      entity_id: binary_sensor.notify_home
    options: {}
  - alias: Run once a day (wait at least 12 hours)
    condition: template
    value_template: '{% set hours = 12 %} {% set last = state_attr(this.entity_id,
      ''last_triggered'') %} {{ last is none or (now() - last).total_seconds() > hours
      * 3600 }}

      '
  actions:
  - condition: state
    entity_id: binary_sensor.water_heater_panel_heating
    state: 'off'
  - condition: numeric_state
    entity_id:
    - sensor.temperature_water_heater_top
    below: 50
  - data: {}
    target:
      entity_id: climate.water_heater
    action: climate.turn_on
  mode: single
- id: '1776266173921'
  alias: Desumidificador - Ajustar para a Média
  description: Set the portable dehumidifier's humidity target to the current outdoor
    humidity average at sunset and at 20:00, allowing either an increase or decrease.
  triggers:
  - trigger: time
    at: '20:00:00'
  - trigger: sun
    event: sunset
    offset: 0
  conditions: []
  actions:
  - data:
      humidity: '{{ states(''sensor.humidity_outside_average'') }}'
    target:
      entity_id: humidifier.portable_dehumidifier
    action: humidifier.set_humidity
  mode: single
- id: '1777408429775'
  alias: Água Quente - Apoio Fotovoltaico Ligar
  description: After noon with sun elevation above 30 degrees, directly enable the
    heater switch while its thermostat is off and weather is not sunny or exceptional.
    Require ten minutes off and either tank-top below 50 C or a battery above 95 percent
    with temperature below the solar-excess target.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.deye_inverter_battery_full
    to:
    - 'on'
    from:
    - 'off'
  - trigger: temperature.crossed_threshold
    target:
      entity_id: sensor.temperature_water_heater_top
    options:
      threshold:
        type: below
        value:
          active_choice: number
          number: 57
          unit_of_measurement: °C
  - trigger: temperature.crossed_threshold
    target:
      entity_id:
      - sensor.temperature_water_heater_bottom
    options:
      threshold:
        type: below
        value:
          active_choice: number
          number: 28
          unit_of_measurement: °C
      behavior: all
  - trigger: numeric_state
    entity_id:
    - sun.sun
    attribute: elevation
    above: 30
  - trigger: time
    at: '13:00:00'
  - trigger: power.crossed_threshold
    target:
      entity_id: sensor.deye_inverter_pv_power_average
    options:
      behavior: all
      for: 00:00:00
      threshold:
        type: above
        value:
          active_choice: number
          unit_of_measurement: W
          number: 1500
  conditions:
  - condition: time
    after: '12:00:00'
  - condition: switch.is_off
    target:
      entity_id: switch.water_heater
    options:
      behavior: any
      for:
        hours: 0
        minutes: 10
        seconds: 0
  - condition: climate.is_hvac_mode
    target:
      entity_id: climate.water_heater
    options:
      hvac_mode:
      - 'off'
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: 30
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: temperature.is_value
        target:
          entity_id: sensor.temperature_water_heater_top
        options:
          threshold:
            type: below
            value:
              active_choice: entity
              number: 60
              unit_of_measurement: °C
              entity: input_number.water_heater_solar_excess_temperature
      - condition: battery.is_level
        target:
          entity_id: sensor.deye_inverter_battery
        options:
          threshold:
            type: above
            value:
              active_choice: number
              number: 95
    - condition: temperature.is_value
      target:
        entity_id: sensor.temperature_water_heater_top
      options:
        threshold:
          type: below
          value:
            active_choice: number
            number: 50
            unit_of_measurement: °C
  - condition: not
    conditions:
    - condition: state
      entity_id: weather.home
      state:
      - sunny
      - exceptional
  actions:
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.water_heater
    data: {}
  mode: single
- id: '1777491935590'
  alias: EcoFlow Ligar Saída AC
  description: Restore the EcoFlow AC-output switch after the configured output has
