blueprint:
  name: Notify camera snapshot when motion is detected
  description: >
    While the house is empty, capture a selected camera on a monitored sensor's
    off-to-on transition and send its image to the enabled residents' phones.
    Each camera uses a fixed snapshot filename replaced by subsequent captures.
  domain: automation
  input:
    motion_sensor:
      name: Motion sensor
      description: Binary sensors whose off-to-on transitions trigger a snapshot while household presence is off.
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    camera:
      name: Camera
      description: Camera captured to its per-camera file under /config/www/camera.
      selector:
        entity:
          domain: camera
          multiple: false
    notify_joao:
      name: Notificar João
      description: Send the snapshot notification to Joao's phone when enabled.
      selector:
        boolean: {}
      default: false
    notify_bianca:
      name: Notificar Bianca
      description: Send the snapshot notification to Bianca's phone when enabled.
      selector:
        boolean: {}
      default: false
    notification_tag:
      name: Notification tag
      description: Mobile notification tag used to group or replace alerts from this instance.
    notification_title:
      name: Notification title (Optional)
      description: 'Notification heading; the default is the existing Portuguese motion-detected label.'
      default: Movimento Detectado!
    notification_message:
      name: Notification message (Optional)
      description: 'Notification body; the default renders the triggering sensor name followed by an exclamation mark.'
      default: "{{ motion_sensor_name }}!"

trigger:
  - platform: state
    entity_id: !input motion_sensor
    from: "off"
    to: "on"

variables:
  notify_joao: !input notify_joao
  notify_bianca: !input notify_bianca
  motion_sensor_name: "{{ trigger.to_state.name }}"
  camera: !input camera
  notification_title: !input notification_title
  notification_message: !input notification_message
  snapshot_create_file_path: >
    /config/www/camera/snapshot_{{ states[camera].object_id }}.jpg
  snapshot_access_file_path: >
    {{ snapshot_create_file_path | replace('/config/www', '/local') }}

condition:
  - condition: state
    entity_id: binary_sensor.notify_home
    state: "off"

action:
  - action: camera.snapshot
    target:
      entity_id: !input camera
    data:
      filename: "{{ snapshot_create_file_path }}"
  - if:
      - condition: template
        value_template: "{{ notify_joao }}"
    then:
      - action: notify.mobile_app_radium
        data:
          title: "{{ notification_title }}"
          message: "{{ notification_message }}"
          data:
            channel: Segurança
            image: "{{ snapshot_access_file_path }}"
            clickAction: "/lovelace-subviews/dashboard-cctv"
            priority: high
            persistent: false
            ttl: 0
            sticky: false
            tag: !input notification_tag
            group: "Segurança - Cameras"

  - if:
      - condition: template
        value_template: "{{ notify_bianca }}"
    then:
      - action: notify.mobile_app_calcium
        data:
          title: "{{ notification_title }}"
          message: "{{ notification_message }}"
          data:
            channel: Segurança
            image: "{{ snapshot_access_file_path }}"
            clickAction: "/lovelace-subviews/dashboard-cctv"
            priority: high
            persistent: false
            ttl: 0
            sticky: false
            tag: !input notification_tag
            group: "Segurança - Cameras"
