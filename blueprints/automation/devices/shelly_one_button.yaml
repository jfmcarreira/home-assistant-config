blueprint:
  name: "[Devices] Shelly Device One Button"
  description: >
    Route button1 single/single_push and long/long_push Shelly device triggers
    to supplied action sequences. Restart mode cancels an earlier running
    sequence when another gesture arrives.

  domain: automation
  input:
    device:
      name: Device
      description: Shelly device-registry entry supplying button1 triggers.
      selector:
        device:
          filter:
            - integration: shelly
              manufacturer: Shelly
    button_short:
      name: Short Press
      description: Actions for either supported short-press trigger spelling.
      selector:
        action:
      default: []
    button_long:
      name: Long Press
      description: Actions for either supported long-press trigger spelling.
      selector:
        action:
      default: []

mode: restart
max_exceeded: silent

trigger:
  - trigger: device
    device_id: !input device
    domain: shelly
    subtype: button1
    type: single
    id: first_short_1
  - trigger: device
    device_id: !input device
    domain: shelly
    subtype: button1
    type: single_push
    id: first_short_2

  - trigger: device
    device_id: !input device
    domain: shelly
    subtype: button1
    type: long
    id: first_long_1
  - trigger: device
    device_id: !input device
    domain: shelly
    subtype: button1
    type: long_push
    id: first_long_2

action:
  - choose:
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: first_short_1
              - condition: trigger
                id: first_short_2
        alias: Button One Short
        sequence: !input button_short

      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: first_long_1
              - condition: trigger
                id: first_long_2
        alias: Button One Long
        sequence: !input button_long
