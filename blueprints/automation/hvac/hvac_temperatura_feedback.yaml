blueprint:
  name: "[HVAC] Controlo da Temperatura do Ar Condicionado"
  description: >
    Adjust an AC setpoint by 1 C when measured room temperature differs from the
    target by more than 0.1 C. Require stable heat/cool mode for 30 minutes and
    ten minutes between adjustments. Gate adjustments using heat limits
    of 18-24 C or cooling limits of 16-22 C.

  domain: automation
  input:
    temperature_sensor:
      name: Temperatura
      description: Measured room-temperature sensor; readings must be above zero for adjustment.
      selector:
        entity:
          domain: sensor
          device_class: temperature

    target_temperature:
      name: Temperatura
      description: Input-number helper containing the desired room temperature, not the unit's current setpoint.
      selector:
        entity:
          domain: input_number

    hvac_unit:
      name: Unidade a Controlar
      description: Climate unit whose setpoint is incremented or decremented while it has been heating or cooling for 30 minutes.
      selector:
        entity:
          domain: climate

mode: restart
max_exceeded: silent
trace:
  stored_traces: 100

variables:
  temperature_hysteresis: 0.1
  temperature_sensor: !input temperature_sensor
  temperature_sensor_state: "{{ states(temperature_sensor) }}"
  hvac_unit: !input hvac_unit
  hvac_unit_state: "{{ states(hvac_unit) }}"
  unit_temperature: "{{ state_attr(hvac_unit, 'temperature') }}"
  max_hvac_temperature: >
    {% if hvac_unit_state == 'heat' %}
        24
    {% else %}
        22
    {% endif %}
  min_hvac_temperature: >
    {% if hvac_unit_state == 'heat' %}
        18
    {% else %}
        16
    {% endif %}

trigger:
  - platform: state
    entity_id: !input temperature_sensor

  - platform: state
    entity_id: !input target_temperature

condition:
  - condition: state
    entity_id: !input hvac_unit
    state:
      - "heat"
      - "cool"
    for:
      minutes: 30

  - condition: template
    value_template: >
      {{ now().timestamp() - (this.attributes.last_triggered | as_timestamp | int(0)) > 60 * 10 }}

  - condition: template
    value_template: >
      {{ temperature_sensor_state | float(0) > 0  }}

  - condition: or
    conditions:
      - condition: numeric_state
        entity_id: !input temperature_sensor
        value_template: "{{ float(state.state) + float(temperature_hysteresis) }}"
        below: !input target_temperature

      - condition: numeric_state
        entity_id: !input temperature_sensor
        value_template: "{{ float(state.state) - float(temperature_hysteresis) }}"
        above: !input target_temperature

action:
  - if:
      - alias: "Temperature Baixa"
        condition: numeric_state
        entity_id: !input temperature_sensor
        value_template: "{{ float(state.state) + float(temperature_hysteresis) }}"
        below: !input target_temperature
    then:
      - condition: "{{ unit_temperature < max_hvac_temperature }}"

      - alias: "Aumentar a temperatura da unidade"
        service: climate.set_temperature
        target:
          entity_id: !input hvac_unit
        data:
          temperature: "{{ unit_temperature + 1 }}"
      - stop:

  - if:
      - alias: "Temperature Alta"
        condition: numeric_state
        entity_id: !input temperature_sensor
        value_template: "{{ float(state.state) - float(temperature_hysteresis) }}"
        above: !input target_temperature
    then:
      - condition: "{{ unit_temperature > min_hvac_temperature }}"

      - alias: "Diminuir a temperatura da unidade"
        service: climate.set_temperature
        target:
          entity_id: !input hvac_unit
        data:
          temperature: "{{ unit_temperature - 1 }}"

      - stop:
