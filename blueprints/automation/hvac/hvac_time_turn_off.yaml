blueprint:
  name: "[HVAC] Controlo Horário - Desligar Ar Condicionado"
  description: >-
    Stop selected climate units at a scheduled time when HVAC bypass is off.
    Day eligibility is the selected weekday list OR either enabled workday branch;
    the weekend flags do not restrict a weekday list that already includes all days.

  domain: automation
  input:
    hvac_unit:
      name: Unidade a Controlar
      description: Climate units receiving the scheduled turn-off command.
      selector:
        entity:
          domain: climate
          multiple: true

    schedule:
      name: Horário
      description: Local time at which the shutdown is evaluated.
      selector:
        time:

    run_on_weekends:
      name: Fim de Semana
      description: Enable an additional workday-sensor eligibility branch. Despite this input name, that branch checks workday on, not off.
      default: false
      selector:
        boolean:

    weekend_tomorrow:
      name: Verificar Dia Seguinte
      description: Select tomorrow's workday sensor for the additional enabled branch instead of today's; the explicit weekday list remains an independent alternative.
      default: false
      selector:
        boolean:

    weekday:
      name: Dia da Semana
      description: Explicit eligible weekdays; this OR branch independently permits shutdown regardless of the weekend flags.
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          options:
            - label: Segunda-feira
              value: mon
            - label: Terça-feira
              value: tue
            - label: Quarta-feira
              value: wed
            - label: Quinta-feira
              value: thu
            - label: Sexta-feira
              value: fri
            - label: Sábado
              value: sat
            - label: Domingo
              value: sun
          custom_value: false
          multiple: true

mode: restart
max_exceeded: silent

variables:
  run_on_weekends: !input run_on_weekends
  weekend_tomorrow: !input weekend_tomorrow

trigger:
  - platform: time
    id: normal_time
    at: !input schedule

condition:
  - condition: state
    entity_id: input_boolean.automation_bypass_hvac
    state: "off"

  - condition: or
    conditions:
      - condition: time
        weekday: !input "weekday"
      - condition: and
        conditions:
          - "{{ not weekend_tomorrow }}"
          - "{{ run_on_weekends }}"
          - condition: state
            entity_id: binary_sensor.workday
            state: "on"
      - condition: and
        conditions:
          - "{{ weekend_tomorrow }}"
          - "{{ run_on_weekends }}"
          - condition: state
            entity_id: binary_sensor.workday_tomorrow
            state: "on"

action:
  # - action: switch.turn_on
  #   data: {}
  #   target:
  #     entity_id:
  #       - switch.hall_ac_echo
  #       - switch.office_ac_echo
  #       - switch.bedroom_henrique_ac_echo
  #       - switch.master_bedroom_ac_echo
  #       - switch.bedroom_ricardo_ac_echo

  - service: climate.turn_off
    target:
      entity_id: !input hvac_unit
