blueprint:
  name: "[HVAC] Controlo Horário - Ligar Ar Condicionado"
  description: >-
    Start heating or cooling within a selected season/day/time window when units
    are off, windows are clear, HVAC bypass and extended-away mode are off, and
    measured temperatures satisfy the room threshold and house target band.
    Require 12 hours between runs. Set auto fan and swing, run optional actions,
    and optionally offset the setpoint after one hour. The end time does not stop HVAC.

  domain: automation
  input:
    hvac_unit:
      name: Unidade a Controlar
      description: Climate units that must all be off before starting and receive the same mode, target, fan and swing commands.
      selector:
        entity:
          domain: climate
          multiple: true

    hvac_mode_heat:
      name: Mode Calor
      description: Select heating when true or cooling when false; heating also requires outdoor temperature below the room threshold.
      default: true
      selector:
        boolean:

    schedule_start:
      name: Horário de ínicio de controlo
      description: Start of the allowed control window and a scheduled trigger time; the strict after condition still applies at evaluation.
      selector:
        time:

    schedule_end:
      name: Horário de fim de controlo
      description: End of the allowed start window, not an automatic shutdown time.
      selector:
        time:

    weekday:
      name: Dia da Semana
      description: Days on which new scheduled-HVAC runs are eligible.
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          options:
            - label: Segunda-feira
              value: mon
            - label: Terça-feira
              value: tue
            - label: Quarta-feira
              value: wed
            - label: Quinta-feira
              value: thu
            - label: Sexta-feira
              value: fri
            - label: Sábado
              value: sat
            - label: Domingo
              value: sun
          custom_value: false
          multiple: true

    hvac_temperature:
      name: Temperatura do AC
      description: Initial setpoint sent to every selected climate unit, distinct from the measured room-temperature threshold.
      default: 20
      selector:
        number:
          step: 0.5
          min: 18
          max: 26

    extra_hvac_actions:
      name: Acções Extra
      description: Actions executed after setting mode, temperature, auto fan and swing, before any delayed setpoint change.
      default: []
      selector:
        action:

    hvac_delayed_temperature_offset:
      name: Temperatura do AC Após 1h
      description: Offset added to the initial setpoint after one hour; zero skips the delay and adjustment.
      default: 0
      selector:
        number:
          mode: box
          min: -2
          max: +2

    temperature_sensor:
      name: Sensor de Temperatura
      description: Measured room or floor-average temperature used for eligibility and threshold triggers.
      default:
      selector:
        entity:
          domain: sensor
          device_class: temperature

    window_sensor:
      name: Sensor da Janelas
      description: Local or floor window sensor required off, in addition to the hard-coded whole-house window check.
      default: []
      selector:
        entity:
          domain: binary_sensor
          device_class: window

    room_temperature:
      name: Temperatura da Divisão
      description: Measured-temperature threshold for starting; heat requires room and outside below it, while cool requires room above it.
      default: 20
      selector:
        number:
          min: 18
          max: 25
          step: 0.1
          unit_of_measurement: "ºC"

    room_temperature_diff:
      name: Diferença para a Referência
      description: Minimum room-temperature gap from the house low target for heating or high target for cooling, in C.
      default: 0
      selector:
        number:
          min: 0
          max: 2
          step: 0.1
          unit_of_measurement: "ºC"

    selected_season:
      name: Estação do Ano
      description: Allowed states of sensor.season for starting the routine.
      default: [spring, summer, autumn, winter]
      selector:
        select:
          options:
            - label: Primavera
              value: spring
            - label: Verão
              value: summer
            - label: Outono
              value: autumn
            - label: Inverno
              value: winter
          custom_value: false
          multiple: true

mode: restart
max_exceeded: silent

variables:
  hvac_temperature: !input hvac_temperature
  hvac_mode_heat: !input hvac_mode_heat
  hvac_delayed_temperature_offset: !input hvac_delayed_temperature_offset
  room_temperature: !input room_temperature
  room_temperature_diff: !input room_temperature_diff

trigger:
  - trigger: time
    id: normal_time
    at: !input schedule_start

  - trigger: numeric_state
    entity_id: !input temperature_sensor
    below: !input room_temperature
    for:
      minutes: 10

  - trigger: numeric_state
    entity_id: sensor.temperature_outside
    below: !input room_temperature
    for:
      minutes: 10

  - trigger: numeric_state
    entity_id: sensor.temperature_outside
    above: !input room_temperature
    for:
      minutes: 10

condition:
  - condition: state
    entity_id: input_boolean.automation_bypass_hvac
    state: "off"

  - condition: state
    entity_id: input_boolean.extended_away_mode
    state:
      - "off"

  - condition: state
    entity_id: !input hvac_unit
    state:
      - "off"

  - condition: state
    entity_id: sensor.season
    state: !input "selected_season"

  - condition: time
    after: !input schedule_start
    before: !input schedule_end

  - condition: time
    weekday: !input "weekday"

  - alias: "Window Closed"
    condition: state
    entity_id: !input window_sensor
    state: "off"

  - alias: "All Windows Closed"
    condition: state
    entity_id: binary_sensor.window_all_house
    state:
      - "off"

  - alias: "Run once a day (wait at least 12 hours)"
    condition: template
    value_template: >
      {% set hours = 12 %}
      {% set last = state_attr(this.entity_id, 'last_triggered') %}
      {{ last is none or (now() - last).total_seconds() > hours * 3600 }}

  - condition: or
    conditions:
      - condition: and
        conditions:
          - "{{ hvac_mode_heat == true }}"
          - condition: numeric_state
            entity_id: !input temperature_sensor
            below: !input room_temperature
          - condition: numeric_state
            entity_id: sensor.temperature_outside
            below: !input room_temperature
          - condition: template
            value_template: "{{ (states('input_number.house_target_low_temperature') | float - states(temperature_sensor) | float) >= room_temperature_diff  }}"
      - condition: and
        conditions:
          - "{{ hvac_mode_heat == false }}"
          - condition: numeric_state
            entity_id: !input temperature_sensor
            above: !input room_temperature
          - condition: template
            value_template: "{{ (states(temperature_sensor) | float - states('input_number.house_target_high_temperature') | float) >= room_temperature_diff }}"

action:
  - if:
      - "{{ hvac_mode_heat == true }}"
    then:
      - action: climate.set_hvac_mode
        target:
          entity_id: !input hvac_unit
        data:
          hvac_mode: heat
    else:
      - action: climate.set_hvac_mode
        target:
          entity_id: !input hvac_unit
        data:
          hvac_mode: cool

  - action: climate.set_temperature
    target:
      entity_id: !input hvac_unit
    data:
      temperature: !input hvac_temperature

  - action: climate.set_fan_mode
    data:
      fan_mode: auto
    target:
      entity_id: !input hvac_unit

  - action: climate.set_swing_mode
    data:
      swing_mode: swing
    target:
      entity_id: !input hvac_unit

  - sequence: !input extra_hvac_actions

  - condition: template
    value_template: "{{ (hvac_delayed_temperature_offset | int | abs) > 0  }}"

  - delay:
      hours: 1

  - action: climate.set_temperature
    target:
      entity_id: !input hvac_unit
    data:
      temperature: "{{ hvac_temperature + hvac_delayed_temperature_offset }}"
