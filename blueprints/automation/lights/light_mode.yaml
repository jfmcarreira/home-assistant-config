blueprint:
  name: "[Lights] Configurar Luz com Base no Estado da Casa"
  description: >
    Apply a scene when the selected light turns on. Use the day scene only in
    On mode and the night scene in other modes. A retrigger during the five-second
    running window can select the supplied fallback scene.

  domain: automation
  input:
    master_light:
      name: Luz
      description: Light whose off-to-on transition selects a lighting scene.
      selector:
        entity:
          domain: light
    scene_day:
      name: Cenário de Dia
      description: Scene applied when house mode is On and the fallback branch is not selected.
      default:
      selector:
        entity:
          domain: scene
    scene_night:
      name: Cenário de Noite
      description: Scene applied in every house mode other than On when the fallback branch is not selected.
      default:
      selector:
        entity:
          domain: scene

    scene_fallback:
      name: (OPCIONAL) Cenário em caso de duplo trigger
      description: Optional scene for a retrigger while the automation is already running during its five-second window.
      default:
      selector:
        entity:
          domain: scene

mode: restart
max_exceeded: silent
variables:
  scene_fallback: !input scene_fallback

trigger:
  - platform: state
    entity_id: !input master_light
    from: "off"
    to: "on"

action:
  - alias: "Verificar se a luz acabou de ser acesa"
    choose:
      - conditions: "{{ scene_fallback != none and this.attributes.current == 1 }}"
        sequence:
          - scene: !input scene_fallback
    default:
      - alias: "Verificar o modo de funcionamento"
        choose:
          - conditions:
              - condition: state
                entity_id: input_select.house_mode
                state: "On"
            sequence:
              - scene: !input scene_day
        default:
          - scene: !input scene_night

  - alias: "Esperar 5s por um novo accionamento"
    delay: 5
