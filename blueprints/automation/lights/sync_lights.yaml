blueprint:
  name: "[Lights] Sync Light State"
  description: >
    Propagate selected master/extra light switch-off transitions and optionally
    switch off the extra light when the master turns on. The two master-on choose
    branches have the same trigger match, so the first branch is selected even
    when its exclusive flag is false; the later sync_on branch is not reached.

  domain: automation
  input:
    master_light:
      name: Master light
      description: Light whose on/off transitions are used to control the extra light.
      selector:
        entity:
          domain: light
    slave_light:
      name: Extra light
      description: Light controlled from the master; its off transition can optionally switch the master off.
      default:
      selector:
        entity:
          domain: light
    sync_exclusive:
      name: Turn light off when master turns on
      description: Switch the extra light off on a master-on transition; this does not react to an extra-light on transition.
      default: false
      selector:
        boolean:
    sync_on:
      name: Turn light on when master turns on
      description: Intended master-on propagation flag; currently shadowed by the preceding master-on choose branch, so it has no effect in this implementation.
      default: false
      selector:
        boolean:
    sync_off:
      name: Turn light off when master turns off
      description: Switch the extra light off when the master changes from on to off.
      default: false
      selector:
        boolean:
    sync_off_from_slave:
      name: Turn light off when slave turns off
      description: Switch the master off when the extra light changes from on to off.
      default: false
      selector:
        boolean:

mode: restart
max_exceeded: silent

variables:
  sync_exclusive: !input sync_exclusive
  sync_on: !input sync_on
  sync_off: !input sync_off
  sync_off_from_slave: !input sync_off_from_slave

trigger:
  - id: master_light_trigger_on
    platform: state
    entity_id: !input master_light
    from: "off"
    to: "on"
  - id: master_light_trigger_off
    platform: state
    entity_id: !input master_light
    from: "on"
    to: "off"
  - id: extra_light_trigger
    platform: state
    entity_id: !input slave_light
    from: "on"
    to: "off"

action:
  - choose:
      - conditions:
          - "{{ trigger.id == 'extra_light_trigger' }}"
        sequence:
          - condition: state
            entity_id: !input slave_light
            state: "off"
          - condition: "{{ sync_off_from_slave == True }}"
          - service: homeassistant.turn_off
            data:
              entity_id: !input master_light

      - conditions: "{{ trigger.id == 'master_light_trigger_on'}}"
        sequence:
          - condition: "{{ sync_exclusive == True }}"
          - service: homeassistant.turn_off
            data:
              entity_id: !input slave_light

      - conditions: "{{ trigger.id == 'master_light_trigger_on'}}"
        sequence:
          - condition: "{{ sync_on == True }}"
          - service: homeassistant.turn_on
            data:
              entity_id: !input slave_light

      - conditions: "{{ trigger.id == 'master_light_trigger_off' }}"
        sequence:
          - condition: "{{ sync_off == True }}"
          - service: homeassistant.turn_off
            data:
              entity_id: !input slave_light
