blueprint:
  domain: automation
  name: "[Location] Sync Device Location"
  description: >-
    When the Wi-Fi tracker is not home but the mobile tracker remains home,
    request phone location updates every 20 seconds, up to 20 attempts. Stop
    when Wi-Fi returns home or the mobile tracker leaves home; do not directly
    overwrite either tracker state.

  input:
    mobile_device:
      name: Device
      description: Mobile-app device that receives request_location_update notifications.
      default: ""
      selector:
        device:
          entity:
            domain: device_tracker
          filter:
            integration: mobile_app
    wifi_location:
      name: Wifi Tracker
      description: Wi-Fi tracker whose changes trigger reconciliation; home state prevents or ends requests.
      selector:
        entity:
          filter:
            - domain: device_tracker
    mobile_location:
      name: Mobile Tracker
      description: Phone location tracker that must still say home for another location request to be sent.
      selector:
        entity:
          filter:
            - domain: device_tracker

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input wifi_location

condition:
  - condition: not
    conditions:
      - condition: state
        entity_id: !input wifi_location
        state: "home"

action:
  - repeat:
      while:
        - condition: not
          conditions:
            - condition: state
              entity_id: !input wifi_location
              state: "home"
        - condition: state
          entity_id: !input mobile_location
          state: "home"
        - condition: template
          value_template: "{{ repeat.index <= 20 }}"
      sequence:
        - device_id: !input mobile_device
          domain: mobile_app
          type: notify
          message: request_location_update
        - delay:
            seconds: 20
