blueprint:
  domain: script
  name: "[HVAC] Dehumidifier Routine"
  description: >-
    Request 18 C dry mode and wait up to 90 minutes or for a listed mode change.
    If still active, stop unless optional heating is enabled and room temperature
    is not above 20 C. The heating phase uses the house high-temperature target
    and stops on a listed mode/temperature transition or after 30 minutes.
  input:
    hvac_entitiy:
      name: Ar Condicionado
      description: Single AC unit used for drying and optional heating; preserve the existing input-key spelling in instances.
      selector:
        entity:
          multiple: false
          filter:
            - domain: climate
    temperature_sensor:
      name: Sensor Temperatura
      description: Room sensor controlling post-drying heating eligibility and the above minimum temperature heating stop trigger.
      selector:
        entity:
          multiple: false
          filter:
            - domain: sensor
              device_class: temperature
    heat_after:
      name: Aquecer
      description: Allow post-drying heating when the room is not above 20 C; false requests shutdown after the drying wait.
      default: false
      selector:
        boolean:

mode: restart

variables:
  heat_after: !input heat_after

sequence:
  - action: climate.set_temperature
    continue_on_error: true
    data:
      temperature: 18
    target:
      entity_id: !input hvac_entitiy

  - action: climate.set_hvac_mode
    data:
      hvac_mode: dry
    target:
      entity_id: !input hvac_entitiy

  - wait_for_trigger:
      - trigger: state
        entity_id: !input hvac_entitiy
        from: dry
    timeout:
      hours: 1
      minutes: 30
    continue_on_timeout: true

  - condition: state
    entity_id: !input hvac_entitiy
    state: dry

  - delay: 10

  - condition: state
    entity_id: !input hvac_entitiy
    state: dry

  - action: climate.set_temperature
    continue_on_error: true
    data:
      temperature: "{{ states('input_number.house_target_low_temperature') | float(0) + 1 }}"
    target:
      entity_id: !input hvac_entitiy

  - if:
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ not heat_after }}"
          - condition: temperature.is_value
            target:
              entity_id: !input temperature_sensor
            options:
              threshold:
                type: above
                value:
                  active_choice: number
                  number: 21
                  unit_of_measurement: °C
              behavior: all
    then:
      - action: climate.turn_off
        target:
          entity_id: !input hvac_entitiy
        data: {}
      - action: climate.set_hvac_mode
        metadata: {}
        data:
          hvac_mode: "off"
        target:
          entity_id: !input hvac_entitiy
      - stop: ""

  - action: climate.set_hvac_mode
    data:
      hvac_mode: heat
    target:
      entity_id: !input hvac_entitiy

  - delay: 10

  - condition: state
    entity_id: !input hvac_entitiy
    state: heat

  - wait_for_trigger:
      - trigger: state
        entity_id: !input hvac_entitiy
        from: heat
      - trigger: temperature.crossed_threshold
        target:
          entity_id: !input temperature_sensor
        options:
          threshold:
            type: above
            value:
              active_choice: number
              number: 21
              unit_of_measurement: °C
          behavior: all
    timeout:
      minutes: 30
    continue_on_timeout: true

  - condition: state
    entity_id: !input hvac_entitiy
    state: heat

  - action: climate.turn_off
    target:
      entity_id: !input hvac_entitiy
    data: {}

  - action: climate.set_hvac_mode
    metadata: {}
    data:
      hvac_mode: "off"
    target:
      entity_id: !input hvac_entitiy
