blueprint:
  name: "[HVAC] Controlo Excedente Solar - Acao Ar Condicionado"
  description: >-
    Select heating below the house low-temperature target or cooling otherwise,
    set the corresponding house target with auto fan and swing, then wait for a
    configured temperature, battery, PV, arrival or unit-off transition before
    shutdown. There is no overall timeout; the calling automation must check solar eligibility.
  domain: script
  input:
    hvac_unit:
      name: Unidade a Controlar
      description: Single climate unit controlled throughout this script.
      selector:
        entity:
          filter:
            - domain: climate

    temperature_sensor:
      name: Sensor de Temperatura
      description: Room temperature used to select heat/cool and by both temperature stop-trigger templates.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature

mode: single

variables:
  temperature_sensor: !input temperature_sensor

sequence:
  - if:
      - condition: state
        entity_id: !input hvac_unit
        state:
          - "off"
    then:
      - if:
          - condition: numeric_state
            entity_id: !input temperature_sensor
            below: input_number.house_target_low_temperature
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input hvac_unit
            data:
              hvac_mode: heat
          - action: climate.set_temperature
            target:
              entity_id: !input hvac_unit
            data:
              temperature: "{{ states('input_number.house_target_low_temperature') | float(0) }}"
        else:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input hvac_unit
            data:
              hvac_mode: cool
          - action: climate.set_temperature
            target:
              entity_id: !input hvac_unit
            data:
              temperature: "{{ states('input_number.house_target_high_temperature') | float(0) }}"

      - action: climate.set_fan_mode
        data:
          fan_mode: auto
        target:
          entity_id: !input hvac_unit

      - action: climate.set_swing_mode
        data:
          swing_mode: swing
        target:
          entity_id: !input hvac_unit

  - alias: "Wait for a solar HVAC stop condition"
    wait_for_trigger:
      - trigger: template
        value_template: >-
          {{
            states(temperature_sensor) | float(0)
            >= states('input_number.house_target_low_temperature') | float(0) + 1
          }}
        for:
          minutes: 10
      - trigger: template
        value_template: >-
          {{
            states(temperature_sensor) | float(0)
            <= states('input_number.house_target_high_temperature') | float(0) - 1
          }}
        for:
          minutes: 10
      - trigger: numeric_state
        entity_id: sensor.deye_inverter_battery
        below: 95
      - trigger: numeric_state
        entity_id: sensor.deye_inverter_pv_power_average
        below: 1500
        for:
          minutes: 10
      - trigger: state
        entity_id: binary_sensor.notify_home
        to: "on"
        for:
          seconds: 5
      - trigger: state
        entity_id: !input hvac_unit
        to: "off"

  - action: climate.turn_off
    target:
      entity_id: !input hvac_unit
