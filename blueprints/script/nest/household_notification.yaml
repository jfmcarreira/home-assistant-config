blueprint:
  domain: script
  name: Notification Script
  description: >-
    Send mobile notifications separately to Joao and Bianca only when each
    person entity is home. Forward title, message and persistent setting;
    the priority input is currently not forwarded by the action data.

  input:
    title:
      name: "Title"
      description: "Notification heading, not an action-button label."
      default: ""
      selector:
        text:
    message:
      name: "Message"
      description: "Message delivered to each eligible resident's phone."
      selector:
        text:
    persistent:
      name: Notificação Persistente
      description: Persistent flag passed to the mobile notification data.
      default: false
      selector:
        boolean:
    priority:
      name: Prioridade
      description: Retained input whose forwarding is commented out; changing it currently does not alter delivered notification priority.
      default: "low"
      selector:
        select:
          mode: list
          options:
            - label: Alta
              value: high
            - label: Baixa
              value: low
mode: restart

sequence:
  - choose:
      - conditions:
          - condition: state
            entity_id: person.joao_carreira
            state: home
        sequence:
          - service: notify.mobile_app_radium
            data:
              title: !input title
              message: !input message
              data:
                #priority: !input priority
                persistent: !input persistent
  - choose:
      - conditions:
          - condition: state
            entity_id: person.bianca_pires
            state: home
        sequence:
          - service: notify.mobile_app_calcium
            data:
              title: !input title
              message: !input message
              data:
                #priority: !input priority
                persistent: !input persistent
