blueprint:
  name: appliance_running_state
  description: Create an appliance-running binary sensor with power hysteresis. Require above 50 W for one minute to start and below 3 W for two minutes to stop; mark unavailable when the power source is unknown or unavailable.
  domain: template
  input:
    power_sensor_entity:
      name: Power Sensor
      description: Appliance power measurement in watts, used for the start/stop thresholds.
      selector:
        entity:
          domain: sensor
          device_class: power
    icon:
      name: Icon
      description: Static icon for the running-state binary sensor.
      selector:
        icon:

variables:
  power_sensor_entity: !input power_sensor_entity
binary_sensor:
  device_class: plug
  icon: !input icon
  delay_on:
    minutes: 1
  delay_off:
    minutes: 2
  availability: >
    {{ states(power_sensor_entity) not in ('unknown', 'unavailable') }}
  state: >
    {% if is_state(this.entity_id, 'on') %}
        {%- if ( states(power_sensor_entity) | int(0) ) < 3 %}
            False
        {%- else %}
            True
        {%- endif %}
    {%- else %}
        {%- if ( states(power_sensor_entity) | int(0) ) > 50 %}
            True
        {%- else %}
            False
        {%- endif %}
    {%- endif %}
