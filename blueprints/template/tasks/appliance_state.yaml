blueprint:
  name: appliance_state
  description: Create an appliance display sensor combining door, running and pending-task state. An open door takes display precedence; otherwise show running, completed-task or Desligada. Icon selection follows running/task state independently of the door.
  domain: template
  input:
    appliance_running_state:
      name: Maquina
      description: Running-state binary sensor that also determines availability of the display sensor.
      selector:
        entity:
          domain: binary_sensor
          device_class: plug
    appliance_task:
      name: Tarefa da Máquina
      description: Binary sensor on when completed contents still require attention, such as emptying the appliance.
      selector:
        entity:
          domain: binary_sensor
          device_class: plug
    appliance_door:
      name: Porta da Máquina
      description: Door sensor whose on state forces the display text Aberta, even when a running or pending-task state exists.
      selector:
        entity:
          domain: binary_sensor
    appliance_task_running_name:
      name: Tarefa da Máquina a Decorrer
      description: Display text while the appliance runs with its door closed.
      selector:
        text:
    appliance_task_name:
      name: Tarefa da Máquina Concluída
      description: Display text for completed contents awaiting attention with the door closed.
      selector:
        text:
    icon:
      name: Icon - Estado Normal
      description: Base icon used while running; pending and idle states append -alert and -off respectively.
      selector:
        icon:
variables:
  appliance_running_state: !input appliance_running_state
  appliance_task: !input appliance_task
  appliance_door: !input appliance_door
  appliance_task_running_name: !input appliance_task_running_name
  appliance_task_name: !input appliance_task_name
  icon: !input icon
sensor:
  availability: >
    {{ states(appliance_running_state) not in ('unknown', 'unavailable') }}
  state: >-
    {% if is_state(appliance_door, 'on' )  %}
      Aberta
    {% else %}
      {% if is_state(appliance_running_state, 'on' )  %}
        {{ appliance_task_running_name }}
      {% elif is_state(appliance_task, 'on' )  %}
        {{ appliance_task_name }}
      {% else %}
        Desligada
      {% endif %}
    {% endif %}
  icon: >-
    {% if is_state(appliance_running_state, 'on' )  %}
      {{ icon }}
    {% elif is_state(appliance_task, 'on' )  %}
      {{ icon ~ '-alert' }}
    {% else %}
      {{ icon ~ '-off' }}
    {% endif %}
