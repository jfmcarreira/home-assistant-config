decluttering_cover:
  card:
    type: tile
    features:
      - type: cover-open-close
    icon_tap_action:
      action: more-info
    name: "[[room_name]]"
    entity: cover.[[room_code_name]]
    icon: "[[room_icon]]"
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          auto_close: false
          large: false
          allow_nested_more_info: false
          adaptive: true
          adaptive_allow_mode_change: false
          adaptive_force_bottom_sheet: true
          size: normal
          style: |
            --popup-min-width: 1000px;
          title: "[[details_title]]"
          content:
            type: custom:layout-card
            layout_type: custom:horizontal-layout
            layout:
              max_cols: 2
              max_width: 300px
            cards:
              - type: custom:mod-card
                view_layout:
                  column: 1
                style:
                  hui-horizontal-stack-card$: |
                    :host {
                      height: auto;
                    }
                card:
                  type: horizontal-stack
                  cards:
                    - type: custom:button-card
                      name: Parcialmente Aberto
                      icon: mdi:window-shutter
                      styles:
                        icon:
                          - color: var(--state-icon-color)
                      icon_height: 40px
                      tap_action:
                        action: call-service
                        service: >-
                          esphome.bhonofre_cover_[[room_code_name]]_minimal_open_cover
                    - type: custom:button-card
                      name: A Meio
                      icon: mdi:window-shutter-open
                      icon_height: 40px
                      styles:
                        icon:
                          - color: var(--state-icon-color)
                      tap_action:
                        action: call-service
                        service: >-
                          esphome.bhonofre_cover_[[room_code_name]]_middle_open_cover
              - features:
                  - type: cover-open-close
                  - type: cover-position
                type: tile
                icon_tap_action:
                  action: more-info
                name: "[[room_name]]"
                entity: cover.[[room_code_name]]
                icon: mdi:stairs
                features_position: bottom
                vertical: false
                view_layout:
                  column: 1
              - type: custom:auto-entities
                card:
                  type: entities
                filter:
                  include:
                    - entity_id: input_boolean.cover_control_*_[[room_code_name]]
                    - entity_id: number.*_position_[[room_code_name]]
                    - entity_id: input_number.*_position_[[room_code_name]]
                    - entity_id: select.cover_[[room_code_name]]_last_action
                view_layout:
                  column: 2
decluttering_haier_ac:
  card:
    type: tile
    features:
      - style: icons
        type: climate-hvac-modes
        hvac_modes:
          - heat
          - cool
          - dry
          - fan_only
          - "off"
      - type: target-temperature
      - style: icons
        type: climate-fan-modes
    entity: climate.[[room_code_name]]
    state_content:
      - current_temperature
      - swing_mode
      - preset_mode
    name: "[[room_name]]"
    features_position: bottom
    vertical: false
    tap_action:
      action: more-info
    icon_tap_action:
        action: perform-action
        perform_action: switch.toggle
        target:
          entity_id: switch.[[room_code_name]]_ac
    hold_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          auto_close: false
          large: false
          allow_nested_more_info: false
          adaptive: true
          adaptive_allow_mode_change: false
          adaptive_force_bottom_sheet: true
          size: normal
          style: |
            --popup-min-width: 800px;
          content:
            type: custom:vertical-stack-in-card
            cards:
              - type: custom:more-info-card
                entity: climate.[[room_code_name]]
                card_mod:
                  style:
                    more-info-content: |
                      state-card-content {
                        display: none;
                      }
              - type: entities
                entities:
                  - entity: switch.[[room_code_name]]_ac_display
                    name: Ecrã
                  - entity: sensor.coiler_temperature_[[room_code_name]]
                    name: Temperatura do Radiador Interior
                    secondary_info: last-updated
              - cards:
                  - type: custom:button-card
                    entity: automation.hvac_[[room_code_name]]_solar_cooling
                    name: Apoio Solar
                    icon: mdi:solar-power
                    tap_action:
                      action: call-service
                      service: automation.trigger
                      data:
                        skip_condition: true
                      target:
                        entity_id: automation.hvac_[[room_code_name]]_solar_cooling
                    hold_action:
                      action: more-info
                    styles:
                      card:
                        - height: 90px
                        - border-radius: 16px
                        - padding: 10px
                        - background: >
                            [[[
                              return entity.attributes.current > 0
                                ? 'var(--state-icon-active-color)'
                                : 'var(--ha-card-background)';
                            ]]]
                      icon:
                        - width: 28px
                        - color: >
                            [[[
                              return entity.attributes.current > 0
                                ? 'var(--primary-background-color)'
                                : 'var(--state-icon-color)';
                            ]]]
                      name:
                        - font-size: 12px
                        - font-weight: 500
                        - white-space: normal
                        - text-align: center
                        - line-height: 1.15
                        - color: >
                            [[[
                              return entity.attributes.current > 0
                                ? 'var(--primary-background-color)'
                                : 'var(--primary-text-color)';
                            ]]]

                  - type: custom:button-card
                    entity: script.hvac_routine_dehumidifier_[[room_code_name]]
                    name: Desumidificação
                    icon: mdi:water-percent

                    tap_action:
                      action: call-service
                      service: script.hvac_routine_dehumidifier_[[room_code_name]]

                    hold_action:
                      action: more-info

                    styles:
                      card:
                        - height: 90px
                        - border-radius: 16px
                        - padding: 10px
                        - background: >
                            [[[
                              return entity.state === 'on'
                                ? 'var(--state-icon-active-color)'
                                : 'var(--ha-card-background)';
                            ]]]
                      icon:
                        - width: 28px
                        - color: >
                            [[[
                              return entity.state === 'on'
                                ? 'var(--primary-background-color)'
                                : 'var(--state-icon-color)';
                            ]]]
                      name:
                        - font-size: 12px
                        - font-weight: 500
                        - white-space: normal
                        - text-align: center
                        - line-height: 1.15
                        - color: >
                            [[[
                              return entity.state === 'on'
                                ? 'var(--primary-background-color)'
                                : 'var(--primary-text-color)';
                            ]]]

                  - type: custom:button-card
                    entity: script.hvac_routine_dehumidifier_heat_[[room_code_name]]
                    name: Desumidificação (Com Aquecimento)
                    icon: mdi:water-thermometer

                    tap_action:
                      action: call-service
                      service: script.hvac_routine_dehumidifier_heat_[[room_code_name]]

                    hold_action:
                      action: more-info

                    styles:
                      card:
                        - height: 90px
                        - border-radius: 16px
                        - padding: 10px
                        - background: >
                            [[[
                              return entity.state === 'on'
                                ? 'var(--state-icon-active-color)'
                                : 'var(--ha-card-background)';
                            ]]]
                      icon:
                        - width: 28px
                        - color: >
                            [[[
                              return entity.state === 'on'
                                ? 'var(--primary-background-color)'
                                : 'var(--state-icon-color)';
                            ]]]
                      name:
                        - font-size: 12px
                        - font-weight: 500
                        - white-space: normal
                        - text-align: center
                        - line-height: 1.15
                        - color: >
                            [[[
                              return entity.state === 'on'
                                ? 'var(--primary-background-color)'
                                : 'var(--primary-text-color)';
                            ]]]

                columns: 3
                square: false
                type: grid
