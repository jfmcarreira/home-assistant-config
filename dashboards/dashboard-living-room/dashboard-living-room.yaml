kiosk_mode:
  hide_header: true
button_card_templates: !include ../common/button-card-templates.yaml
decluttering_templates: !include ../common/declutering.yaml
views:
  - title: Dashboard Downstairs
    path: main
    icon: mdi:sofa
    type: custom:horizontal-layout
    layout:
      max_cols: 2
      column_widths: 30% 70%
      max_width: 300px
      margin: 0px 3px 0px 3px
      padding: 3px 0px 2px 0px
      card_margin: 3px
    badges: []
    cards:
      - type: custom:mod-card
        view_layout:
          column: 1
        style: |
          :host {
            --stack-card-gap: 6px;
            --vertical-stack-card-gap: 6px;
            --horizontal-stack-card-gap: 6px;
            --grid-card-gap: 6px;
          }
        card:
          type: vertical-stack
          cards: !include control-panel.yaml
      - type: custom:mod-card
        view_layout:
          column: 2
        style: |
          :host {
            --stack-card-gap: 6px;
            --vertical-stack-card-gap: 6px;
            --horizontal-stack-card-gap: 6px;
            --grid-card-gap: 6px;
          }
        card:
          type: custom:state-switch
          entity: hash
          default: panel-main
          states:
            panel-barcode:
              type: iframe
              url: http://nest-assistant.home:8621/screen.php
              card_mod:
                style: |
                  :host {
                    display: block;
                    height: calc(100dvh - 12px);
                    max-height: calc(100dvh - 12px);
                  }
                  ha-card {
                    height: 100%;
                    max-height: 100%;
                    box-sizing: border-box;
                    overflow: hidden;
                  }
                  #root {
                    padding-top: 0 !important;
                    min-height: 0;
                    flex: 1;
                  }
            panel-barcode-detail:
              type: iframe
              url: http://nest-assistant.home:8621/
              card_mod:
                style: |
                  :host {
                    display: block;
                    height: calc(100dvh - 12px);
                    max-height: calc(100dvh - 12px);
                  }
                  ha-card {
                    height: 100%;
                    max-height: 100%;
                    box-sizing: border-box;
                    overflow: hidden;
                  }
                  #root {
                    padding-top: 0 !important;
                    min-height: 0;
                    flex: 1;
                  }
            panel-house:
              type: custom:layout-card
              layout_type: custom:horizontal-layout
              layout:
                margin: -6px -3px
                padding: 0px
                card_margin: 6px 3px
                height: 100dvh
                max_cols: 2
              card_mod:
                style: |
                  #columns {
                    overflow-x: hidden;
                    overscroll-behavior: contain;
                    scrollbar-width: none;
                    mask-image: linear-gradient(to bottom, #000 calc(100% - var(--ks-fade-b, 0px)), transparent);
                    animation: ks-fade-bottom linear both;
                    animation-timeline: scroll(self);
                  }
                  @keyframes ks-fade-bottom {
                    0%, 97% { --ks-fade-b: 36px; }
                    99%, 100% { --ks-fade-b: 0px; }
                  }
              cards: !include panel-house.yaml
            panel-wc:
              type: custom:mod-card
              style: |
                :host {
                  display: block;
                  height: calc(100dvh - 12px);
                  --masonry-view-card-margin: 0px;
                }
              card:
                type: custom:layout-card
                layout_type: custom:grid-layout
                layout:
                  margin: 0px
                  padding: 0px
                  grid-template-columns: repeat(3, minmax(0, 1fr))
                  grid-template-rows: calc(100dvh - 326px) 306px
                  grid-template-areas: '"principal suite servico" "equipamentos humidade humidade"'
                  grid-gap: 6px
                cards: !include panel-wc.yaml
            panel-tasks:
              type: custom:layout-card
              layout_type: custom:horizontal-layout
              layout:
