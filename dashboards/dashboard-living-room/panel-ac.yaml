- type: custom:mod-card
  view_layout:
    column: 1
  style:
    hui-horizontal-stack-card$: |
      :host {
        height: auto;
      }
  card:
    square: false
    type: grid
    cards:
      - type: tile
        entity: sensor.temperature_living_room
        name:
          type: area
        vertical: false
        features_position: bottom
      - type: tile
        entity: sensor.temperature_office
        name:
          type: area
        vertical: false
        features_position: bottom
      - type: tile
        entity: sensor.temperature_hall
        name:
          type: area
        vertical: false
        features_position: bottom
    columns: 3

- type: custom:mod-card
  view_layout:
    column: 2
  style:
    hui-horizontal-stack-card$: |
      :host {
        height: auto;
      }
  card:
    square: false
    type: grid
    cards:
      - type: tile
        entity: sensor.temperature_master_bedroom
        name:
          type: area
        vertical: false
        features_position: bottom
      - type: tile
        entity: sensor.temperature_bedroom_ricardo
        name: Q. Ricardo
        vertical: false
        features_position: bottom
      - type: tile
        entity: sensor.temperature_bedroom_henrique
        name: Q. Henrique
        vertical: false
        features_position: bottom
    columns: 3


- type: tile
  entity: climate.living_room
  name: Sala
  state_content:
    - current_temperature
    - swing_mode
    - preset_mode
  vertical: false
  icon_tap_action:
    action: perform-action
    perform_action: switch.toggle
    target:
      entity_id: switch.living_room_ac
  features:
    - style: icons
      type: climate-hvac-modes
      hvac_modes:
        - heat
        - cool
        - dry
        - fan_only
        - "off"
    - type: target-temperature
    - style: icons
      type: climate-fan-modes
  features_position: bottom
  hold_action:
    action: more-info
  tap_action:
    action: fire-dom-event
    browser_mod:
      service: browser_mod.popup
      data:
        auto_close: false
        large: false
        allow_nested_more_info: false
        adaptive: true
        adaptive_allow_mode_change: false
        adaptive_force_bottom_sheet: true
        size: normal
        style: |
          --popup-min-width: 800px;
        content:
          type: custom:vertical-stack-in-card
          cards:
            - type: custom:more-info-card
              entity: climate.living_room
              card_mod:
                style:
                  more-info-content: |
                    state-card-content {
                      display: none;
                    }
            - type: entities
              entities:
                - entity: sensor.temperature_climate_outdoor_daikin
                  name: Temperatura do Radiador Interior
                  secondary_info: last-updated
            - cards:
                - type: custom:button-card
                  entity: automation.hvac_living_room_solar_cooling
                  name: Apoio Solar
                  icon: mdi:solar-power
                  tap_action:
                    action: call-service
                    service: automation.trigger
                    data:
                      skip_condition: true
                    target:
                      entity_id: automation.hvac_living_room_solar_cooling
                  hold_action:
                    action: more-info
                  styles:
                    card:
                      - height: 90px
                      - border-radius: 16px
                      - padding: 10px
                      - background: >
                          [[[
                            return entity.attributes.current > 0
                              ? 'var(--state-icon-active-color)'
                              : 'var(--ha-card-background)';
                          ]]]
                    icon:
                      - width: 28px
                      - color: >
                          [[[
                            return entity.attributes.current > 0
                              ? 'var(--primary-background-color)'
                              : 'var(--state-icon-color)';
                          ]]]
                    name:
                      - font-size: 12px
                      - font-weight: 500
                      - white-space: normal
                      - text-align: center
                      - line-height: 1.15
                      - color: >
                          [[[
                            return entity.attributes.current > 0
                              ? 'var(--primary-background-color)'
                              : 'var(--primary-text-color)';
                          ]]]

                - type: custom:button-card
                  entity: script.hvac_routine_dehumidifier_living_room
                  name: Desumidificação
                  icon: mdi:water-percent

                  tap_action:
                    action: call-service
                    service: script.hvac_routine_dehumidifier_living_room

                  hold_action:
                    action: more-info

                  styles:
                    card:
                      - height: 90px
                      - border-radius: 16px
                      - padding: 10px
                      - background: >
                          [[[
                            return entity.state === 'on'
                              ? 'var(--state-icon-active-color)'
                              : 'var(--ha-card-background)';
                          ]]]
                    icon:
                      - width: 28px
                      - color: >
                          [[[
                            return entity.state === 'on'
                              ? 'var(--primary-background-color)'
                              : 'var(--state-icon-color)';
                          ]]]
                    name:
                      - font-size: 12px
                      - font-weight: 500
                      - white-space: normal
                      - text-align: center
                      - line-height: 1.15
                      - color: >
                          [[[
                            return entity.state === 'on'
                              ? 'var(--primary-background-color)'
                              : 'var(--primary-text-color)';
                          ]]]

                - type: custom:button-card
                  entity: script.hvac_routine_dehumidifier_heat_living_room
                  name: Desumidificação (Com Aquecimento)
                  icon: mdi:water-thermometer

                  tap_action:
                    action: call-service
                    service: script.hvac_routine_dehumidifier_heat_living_room

                  hold_action:
                    action: more-info

                  styles:
                    card:
                      - height: 90px
                      - border-radius: 16px
                      - padding: 10px
                      - background: >
                          [[[
                            return entity.state === 'on'
                              ? 'var(--state-icon-active-color)'
                              : 'var(--ha-card-background)';
                          ]]]
                    icon:
                      - width: 28px
                      - color: >
                          [[[
                            return entity.state === 'on'
                              ? 'var(--primary-background-color)'
                              : 'var(--state-icon-color)';
                          ]]]
                    name:
                      - font-size: 12px
                      - font-weight: 500
                      - white-space: normal
                      - text-align: center
                      - line-height: 1.15
                      - color: >
                          [[[
                            return entity.state === 'on'
                              ? 'var(--primary-background-color)'
                              : 'var(--primary-text-color)';
                          ]]]

              columns: 3
              square: false
              type: grid

