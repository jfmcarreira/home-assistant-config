          entity: light.living_room_dashboard_screen
          features_position: bottom
          vertical: false
          name: "Ecrã Sala"
        - type: tile
          entity: light.hall_dashboard_screen
          vertical: false
          features_position: bottom
          name: "Ecrã Hall"
    - type: grid
      columns: 2
      square: false
      cards:
