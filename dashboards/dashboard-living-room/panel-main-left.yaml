- type: conditional
  view_layout:
    column: 1
  conditions:
    - condition: state
      entity: alarm_control_panel.alarmo
      state: disarmed
  card:
    type: custom:mod-card
    view_layout:
      column: 1
    style:
      hui-horizontal-stack-card$: |
        :host {
          height: auto;
        }
    card:
      type: horizontal-stack
      cards:
        - type: custom:mini-graph-card
          name: Temperatura
          entities:
            - entity: sensor.average_temperature
          line_color: "#e74c3c"
          line_width: 6
          font_size: 75
          height: 80
          align_icon: left
          align_state: center
          hours_to_show: 24
          points_per_hour: 1
          tap_action:
            action: navigate
            navigation_path: /lovelace-subviews/dashboard-climate
        - type: custom:mini-graph-card
          name: Humidade
          entities:
            - entity: sensor.average_humidity
          line_width: 6
          font_size: 75
          height: 80
          align_icon: left
          align_state: center
          hours_to_show: 24
          points_per_hour: 1
          tap_action:
            action: navigate
            navigation_path: /lovelace-subviews/dashboard-climate

- type: custom:mod-card
  view_layout:
    column: 1
  style:
    style: |
      :host {
        height: auto;
      }
  card:
    type: custom:compact-power-card
    view_layout:
      column: 1
    entities:
      pv:
        entity: sensor.deye_inverter_pv_power
        tap_action: navigate
        navigation_path: "#panel-solar"
        labels:
          - entity: sensor.deye_inverter_today_pv_production
            unit: kWh
          - entity: sensor.solar_forecast_today_remaining
            icon: mdi:trending-up
            unit: kWh
      battery:
        - entity: sensor.deye_inverter_battery_power
          battery_soc: sensor.deye_inverter_battery
          battery_capacity: 11.8
          show_soc: true
          unit: W
      grid:
        entity: sensor.house_power_grid
        invert_state_values: true
        labels:
          - entity: sensor.bhpzem_main_voltage
            unit: V
            icon: mdi:sine-wave
          - entity: sensor.house_power_frequency
            unit: Hz
            decimal_places: 2
      home:
        entity: sensor.house_power_consumption
        unit: W
        invert_state_values: false
      battery_labels:
        - entity: sensor.deye_inverter_today_battery_discharge
          unit: kWh
        - entity: sensor.deye_inverter_today_battery_charge
          unit: kWh
        - entity: number.deye_inverter_time_of_use_soc
          unit: "%"
      devices:
        - entity: sensor.device_group_power_machines
          icon: mdi:washing-machine
          unit: W
        - entity: sensor.device_power_water_heater
          icon: mdi:water-boiler
          unit: W
        - entity: sensor.device_power_kitchen_plugs
          icon: mdi:stove
          unit: W
        - entity: sensor.device_power_air_conditioner
          icon: mdi:hvac
          unit: W
        - entity: sensor.device_power_it_rack
          icon: mdi:server
          unit: W
    remove_glow_effects: true
    hide_card_background: false
    disable_home_gradient: false
    enable_device_power_lines: true
    curve_factor: 4
    font_size_multiplier: 1.3
    power_unit: W
    subtract_devices_from_home: false
    threshold_mode: calculations

- type: conditional
  conditions:
    - condition: state
      entity: alarm_control_panel.alarmo
      state_not: disarmed
  card:
    states:
      - arm_home
      - arm_away
    type: alarm-panel
    entity: alarm_control_panel.alarmo
  view_layout:
    column: 1

- type: conditional
  view_layout:
    column: 1
  conditions:
    - condition: state
      entity: alarm_control_panel.alarmo
      state: disarmed
  card:
    type: entity
    entity: sensor.battery_time_left_to_discharge
    icon_height: 28px
    card_mod:
      style: |
        :host {
          display: block;
          height: 85px !important;
          min-height: 0 !important;
        }
        ha-card {
          box-sizing: border-box;
          height: 85px !important;
          min-height: 0 !important;
        }



- type: conditional
  view_layout:
    column: 1
  conditions:
    - condition: state
      entity: alarm_control_panel.alarmo
      state: disarmed
  card:
    type: tile
    view_layout:
      column: 1
    entity: climate.living_room
    state_content:
      - state
      - current_temperature
    vertical: false
    features:
      - type: target-temperature
      - type: climate-hvac-modes
        style: icons
        hvac_modes:
          - heat
          - cool
          - dry
          - fan_only
          - "off"
    features_position: bottom
    tap_action:
      action: more-info

- type: conditional
  view_layout:
    column: 1
  conditions:
    - condition: state
      entity: alarm_control_panel.alarmo
      state: disarmed
  card:
    type: tile
    view_layout:
      column: 1
    entity: climate.water_heater
    vertical: false
    icon_tap_action:
      action: toggle
    features:
      - style: icons
        type: climate-preset-modes
      - type: target-temperature
    features_position: inline
