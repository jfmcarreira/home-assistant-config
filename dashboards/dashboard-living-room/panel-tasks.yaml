- type: custom:mod-card
  view_layout:
    column: 1
  style:
    hui-horizontal-stack-card$: |
      :host {
        height: auto;
      }
  card:
    type: vertical-stack
    cards:
      - type: heading
        heading: "Areia das Gatas"
        heading_style: title
      - type: entity
        entity: sensor.grocy_stock_cat_litter_sand
        name: "Stock de Areia"
        state_color: false
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: binary_sensor.cat_litter_box_need_clean
            name: "Necessita de Limpeza"
          - type: tile
            entity: sensor.cat_litter_box_last_clean
            name: "Última Limpeza"
          - type: tile
            entity: binary_sensor.cat_litter_box_need_change
            name: "Necessita de Substituição"
          - type: tile
            entity: sensor.cat_litter_box_last_change
            name: "Última Substituição"
          - type: tile
            entity: automation.task_cat_litter_clean
          - type: tile
            entity: automation.task_cat_litter_change
      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            entity: binary_sensor.cat_litter_box_need_clean
            name: "Limpar a Areia"
            icon: mdi:broom
            icon_height: 35px
            show_name: true
            show_icon: true
            tap_action:
              action: call-service
              service: automation.trigger
              target:
                entity_id: automation.task_cat_litter_clean
            hold_action:
              action: call-service
              service: automation.trigger
              data:
                skip_condition: true
              target:
                entity_id: automation.task_cat_litter_clean
          - type: button
            entity: binary_sensor.cat_litter_box_need_change
            name: "Trocar a Areia"
            icon: mdi:swap-horizontal
            icon_height: 35px
            show_name: true
            show_icon: true
            tap_action:
              action: call-service
              service: automation.trigger
              target:
                entity_id: automation.task_cat_litter_change
            hold_action:
              action: call-service
              service: automation.trigger
              data:
                skip_condition: true
              target:
                entity_id: automation.task_cat_litter_change

- type: custom:mod-card
  view_layout:
    column: 2
  style:
    hui-horizontal-stack-card$: |
      :host {
        height: auto;
      }
  card:
    type: vertical-stack
    cards:
    - type: heading
      heading: "Filtro da Agua"
      heading_style: title
    - type: entity
      entity: sensor.grocy_stock_water_filters
      name: "Stock de Filtros"
      state_color: false
    - type: tile
      entity: sensor.water_filter_remaing_days
      name: "Duração Restante"
      vertical: false
      features_position: bottom
    - type: grid
      columns: 2
      square: false
      cards:
        - type: tile
          entity: binary_sensor.water_filter_needs_replacement
          name: "Substituir Filtro"
        - type: tile
          entity: input_number.water_filter_replacement_days
        - type: tile
          entity: automation.task_water_filter_replacement
        - type: tile
          entity: sensor.water_filter_replacement_last_done
          name: "Última Substituição"
    - type: button
      entity: binary_sensor.water_filter_needs_replacement
      name: "Trocar o Filtro"
      icon: mdi:filter
      icon_height: 20px
      show_name: true
      show_icon: true
      tap_action:
        action: call-service
        service: automation.trigger
        target:
          entity_id: automation.task_water_filter_replacement
      hold_action:
        action: call-service
        service: automation.trigger
        data:
          skip_condition: true
        target:
          entity_id: automation.task_water_filter_replacement

