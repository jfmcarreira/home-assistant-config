- type: vertical-stack
  view_layout:
    grid-area: principal
  cards:
    - type: heading
      heading: Principal
      heading_style: title
      icon: mdi:shower-head
    - type: custom:mushroom-light-card
      card_mod:
        style: "ha-card { height: 56px; box-sizing: border-box; }"
      entity: light.main_bathroom_ceiling
      name: Luz do Teto
      fill_container: true
      use_light_color: false
    - type: custom:mushroom-light-card
      card_mod:
        style: "ha-card { height: 56px; box-sizing: border-box; }"
      entity: light.main_bathroom_led
      name: "Retro-Iluminação"
    - type: grid
      columns: 2
      square: false
      cards:
        - type: custom:mushroom-fan-card
          layout: vertical
          entity: fan.main_bathroom
          name: Ventoinha
        - type: custom:mushroom-entity-card
          layout: vertical
          entity: switch.auto_fan_main_bathroom
          name: "Automático"
          primary_info: name
        - type: custom:mushroom-entity-card
          layout: horizontal
          icon_type: none
          entity: sensor.humidity_main_bathroom
          name: Humidade
          primary_info: state
          secondary_info: name
        - type: custom:mushroom-entity-card
          layout: horizontal
          icon_type: none
          entity: sensor.humidity_main_bathroom_average
          name: "Média (24h)"
          primary_info: state
          secondary_info: name
        - type: custom:mushroom-entity-card
          layout: horizontal
          icon_type: none
          entity: sensor.temperature_main_bathroom
          name: Temperatura
          primary_info: state
          secondary_info: name
        - type: custom:mushroom-entity-card
          layout: horizontal
          icon_type: none
          entity: sensor.mold_main_bathroom
          secondary_info: name
          primary_info: state
          icon: mdi:cloud-percent
          name: Bolor
