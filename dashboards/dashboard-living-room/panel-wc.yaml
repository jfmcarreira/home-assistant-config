- type: vertical-stack
  view_layout:
    grid-area: equipamentos
  cards:
    - type: conditional
      conditions:
        - condition: or
          conditions:
            - condition: state
              entity: input_select.portable_heater_location
              state: Casa de Banho Principal
            - condition: state
              entity: input_select.portable_heater_location
              state: Casa de Banho da Suite
      card:
        features:
          - type: target-temperature
        type: tile
        entity: climate.portable_heater
        state_content:
          - current_temperature
          - temperature
        name: Aquecedor
        features_position: bottom
        vertical: false
        card_mod:
          style: "ha-card { height: 150px; box-sizing: border-box; }"
    - type: conditional
      conditions:
        - condition: or
          conditions:
            - condition: state
              entity: input_select.dehumidifier_location
              state: Casa de Banho Principal
            - condition: state
              entity: input_select.dehumidifier_location
              state: Casa de Banho da Suite
      card:
        features:
          - type: target-humidity
        type: tile
        entity: humidifier.portable_dehumidifier
        state_content:
          - current_humidity
          - humidity
        name: Desumidificador
        features_position: bottom
        vertical: false
        card_mod:
          style: "ha-card { height: 150px; box-sizing: border-box; }"
- type: custom:mini-graph-card
  view_layout:
    grid-area: humidade
  name: "Humidade · 24 horas"
  icon: mdi:water-percent
  entities:
    - entity: sensor.humidity_main_bathroom
      name: Principal
    - entity: sensor.humidity_master_bedroom_bathroom
      name: Suite
    - entity: sensor.humidity_bathroom_rc
      name: "Serviço"
  hours_to_show: 24
  points_per_hour: 2
  height: 160
  line_width: 2
  animate: false
  show:
    state: false
    legend: true
    labels: true
    fill: false
  card_mod:
    style: "ha-card { height: 306px; box-sizing: border-box; }"
