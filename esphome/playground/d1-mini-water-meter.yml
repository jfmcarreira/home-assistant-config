substitutions:
  devicename: d1-mini-water-meter

esphome:
  friendly_name: D1 Mini Water Meter

esp8266:
  board: d1_mini
  framework:
    version: recommended

packages:
  esphome_base: !include ../packages/common.yml
  esphome_web: !include ../packages/webserver.yml

logger:
  level: DEBUG

# Ref https://github.com/smarthomeshop/waterflowkit/blob/main/waterflowkit-v2/base.yaml
# Calibration 0.001515;  // 1/660
sensor:
  - platform: pulse_counter
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
    name: "Water Flow Portable"
    unit_of_measurement: "L/min"
    id: water_usage
    icon: "mdi:water-pump"
    update_interval: 1s
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DISABLE
    accuracy_decimals: 2
    filters:
      # YF-B2: approximately 660 pulses per litre
      - multiply: 0.0015151515
    total:
      id: sensor_pulse_meter_total
      name: "Water Meter Portable"
      icon: "mdi:cube-outline"
      unit_of_measurement: "L"
      state_class: total_increasing
      device_class: water
      accuracy_decimals: 3
      filters:
        # YF-B2: approximately 660 pulses per litre
        - multiply: 0.0015151515

button:
  - platform: template
    name: "Reset Water Total"
    icon: "mdi:restart"
    entity_category: config
    on_press:
      - pulse_counter.set_total_pulses:
          id: water_usage
          value: 0
