script:
  cover_open_if_close:
    alias: Abrir Estores caso estejam fechados
    description: Open the requested shutter only when its state is closed. Pass the room suffix, such as kitchen, because the script constructs the cover entity ID.
    mode: parallel
    max: 10
    fields:
      action_cover:
        name: Cover
        description: Room suffix such as kitchen; the script prepends cover. to construct the target entity ID.
        example: cover.kitchen
        selector:
          entity:
            multiple: false
            domain: cover

    variables:
      cover_entity: cover.{{ action_cover }}
    sequence:
      - condition: "{{ is_state(cover_entity, 'closed') }}"
      - service: cover.open_cover
        target:
          entity_id: "{{ cover_entity }}"

  cover_middle_pos:
    alias: Colocar Estores a Dois Terços
    description: Set the requested shutter to 66 percent open. The action_cover argument is the room suffix used to construct its cover entity ID.
    mode: parallel
    max: 10
    fields:
      action_cover:
        name: Cover
        description: Room suffix such as kitchen; the script prepends cover. to construct the target entity ID.
        example: cover.kitchen
        selector:
          entity:
            multiple: false
            domain: cover
    variables:
      cover_entity: cover.{{ action_cover }}
    sequence:
      - service: cover.set_cover_position
        data:
          position: 66
        target:
          entity_id: "{{ cover_entity }}"

  cover_partial_open:
    alias: Colocar Estores a Um Terço
    description: Set the requested shutter to 30 percent open. The action_cover argument is the room suffix used to construct its cover entity ID.
    mode: parallel
    max: 10
    fields:
      action_cover:
        name: Cover
        description: Room suffix such as kitchen; the script prepends cover. to construct the target entity ID.
        example: cover.kitchen
        selector:
          entity:
            multiple: false
            domain: cover
    variables:
      cover_entity: cover.{{ action_cover }}
    sequence:
      - service: cover.set_cover_position
        data:
          position: 30
        target:
          entity_id: "{{ cover_entity }}"

  cover_open_if_close_with_heat:
    alias: Abrir Estores Fechados com o Calor
    description: Open a closed shutter only when its last-action select is Sol, so heat recovery does not reopen shutters closed manually or for another reason. Pass its room suffix.
    mode: parallel
    max: 10
    fields:
      action_cover:
        name: Cover
        description: Room suffix used to find both cover.<room> and its last-action select; only shutters marked Sol are reopened.
        example: cover.kitchen
        selector:
          entity:
            multiple: false
            domain: cover

    variables:
      cover_entity: cover.{{ action_cover }}
      last_action_entitiy: select.cover_{{ action_cover }}_last_action
    sequence:
      - condition: "{{ is_state(cover_entity, 'closed') }}"
      - condition: "{{ is_state(last_action_entitiy, 'Sol') }}"
      - service: cover.open_cover
        target:
          entity_id: "{{ cover_entity }}"

  cover_close_when_raining:
    alias: Fechar Estores Durante a Chuva
    description: If the shutter is more open than its rainy-position helper, close it fully, wait up to one minute for closed state and then set the rainy position. Pass the room suffix; timeout does not abort the final position command.
    mode: parallel
    max: 10
    fields:
      action_cover:
        name: Cover
        description: Room suffix used to find cover.<room> and input_number.cover_rainy_position_<room>.
        example: cover.kitchen
        selector:
          entity:
            multiple: false
            domain: cover
    variables:
      cover_entity: cover.{{ action_cover }}
      cover_position: input_number.cover_rainy_position_{{ action_cover }}
    sequence:
      - condition: "{{ (state_attr(cover_entity, 'current_position') | float(0)) > (states(cover_position) | float(100))}}"
      - service: cover.close_cover
        target:
          entity_id: "{{ cover_entity }}"
      - wait_template: "{{ is_state(cover_entity, 'closed') }}"
        timeout:
          minutes: 1
      - service: cover.set_cover_position
        data:
          position: "{{ states(cover_position) }}"
        target:
          entity_id: "{{ cover_entity }}"
