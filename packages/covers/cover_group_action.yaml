script:
  cover_group_action_all:
    alias: Controlo Grupo de Estores (Todos)
    description: Dispatch the requested action and control-helper suffix for all ten configured room shutters through the group controller.
    mode: single
    fields:
      action_to_run:
        description: Action name such as cover.close_cover or script.cover_close_when_raining; script actions receive a room-suffix argument.
        example: cover.open
        required: true
        selector:
          text:
      control_switch:
        description: Policy suffix such as open_sunrise or close_with_heat, used to select each room's cover-control helper.
        example: open_sunrise
        required: true
        selector:
          text:
    sequence:
      - service: script.cover_group_action
        data:
          action_to_run: "{{ action_to_run }}"
          control_switch: "{{ control_switch }}"
          covers_list:
            - living_room
            - stairs
            - bedroom_henrique
            - bedroom_ricardo
            - master_bedroom
            - bathroom
            - bedroom_rc
            - laundry
            - kitchen
            - office

  cover_group_action:
    alias: Controlo Grupo de Estores
    description: Launch an independent worker for each room suffix in covers_list. Workers honor the corresponding control helper; the group derives a last-action reason from the control-switch suffix and returns without waiting for worker completion.
    mode: single
    fields:
      covers_list:
        description: Room suffixes, not full cover entity IDs, used to select independent per-room workers.
        example: cover.open
        required: true
        default:
          - living_room
          - kitchen
          - office
          - stairs
          - laundry
          - bathroom
          - bedroom_rc
          - master_bedroom
          - bedroom_ricardo
          - bedroom_henrique
        selector:
          select:
            multiple: true
            mode: list
            options:
              - label: Sala
                value: living_room
              - label: Escritório
                value: office
              - label: Cozinha
                value: kitchen
              - label: Lavandaria
                value: laundry
              - label: Quarto de Arrumos
                value: bedroom_rc
              - label: Casa de Banho
                value: bathroom
              - label: Suite
                value: master_bedroom
              - label: Quarto do Ricardo
                value: bedroom_ricardo
              - label: Quarto do Henrique
                value: bedroom_henrique
              - label: Escadas
                value: stairs
      action_to_run:
        description: Action name called by each enabled room worker; script actions receive action_cover and direct services target cover.<room>.
        example: cover.open
        required: true
        selector:
          text:
      control_switch:
        description: Policy suffix used in input_boolean.cover_control_<policy>_<room> and mapped to the recorded last-action reason.
        example: open_sunrise
        required: true
        selector:
          text:
    variables:
      last_action: >
        {% set actions = {
          'open_sunrise': 'Sunrise',
          'close_sunset': 'Sunset',
          'close_in_rain': 'Chuva',
          'close_with_heat': 'Sol'
        } %}
        {{ actions.get(control_switch, 'Grupo') }}

    sequence:
      - repeat:
          for_each: "{{ covers_list }}"
          sequence:
            - action: script.turn_on
              target:
                entity_id: script.cover_group_action_worker
              data:
                variables:
                  cover_name: "{{ repeat.item }}"
                  action_to_run: "{{ action_to_run }}"
                  control_switch: "{{ control_switch }}"
                  last_action: "{{ last_action }}"


  cover_group_action_worker:
    alias: Controlo Individual de Estore
    description: Act only if the room's matching cover-control helper is on. Call a script with action_cover or a service targeting the cover, then record the supplied last-action reason after ten seconds. Up to 20 room workers may run concurrently.
    mode: parallel
    max: 20
    sequence:
      - condition: "{{ is_state('input_boolean.cover_control_' + control_switch + '_' ~ cover_name,'on') }}"

      - choose:
          - conditions: "{{ 'script.' in action_to_run }}"
            sequence:
              - service: "{{ action_to_run }}"
                data:
                  action_cover: "{{ cover_name }}"

        default:
          - service: "{{ action_to_run }}"
            target:
              entity_id: "cover.{{ cover_name }}"
      - delay:
          seconds: 10
      - if:
          - "{{ cover_name == 'stairs' }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.cover_stairs_last_action
            data:
              option: "{{ last_action }}"

        else:
          - action: select.select_option
            target:
              entity_id: "select.cover_{{ cover_name }}_last_action"
            data:
              option: "{{ last_action }}"
