template:
  - sensor:
      - name: solar_forecast_today_remaining
        unique_id: solar_forecast_today_remaining
        unit_of_measurement: kWh
        device_class: energy
        state_class: measurement
        state: >-
          {% set fs = states('sensor.forecast_solar_forecast_today_remaining') | float(0) %}
          {% set sc = states('sensor.solcast_pv_forecast_today_remaining') | float(0) %}
          {% if fs > 0 and sc > 0 %}
            {{ (0.6 * fs + 0.4 * sc) | round(2) }}
          {% else %}
            0
          {% endif %}
        availability: >-
          {{ states('sensor.forecast_solar_forecast_today_remaining') | is_number and
             states('sensor.solcast_pv_forecast_today_remaining') | is_number }}