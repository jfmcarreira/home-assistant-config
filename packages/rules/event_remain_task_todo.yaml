homeassistant:
  customize:
    automation.event_remain_task_todo:
      friendly_name: Gerar Evento Para Lembrar Tarefas a Realizar

automation:
  - id: event_remain_task_todo
    alias: event_remain_task_todo
    description: Emit event_remaind_task_todo at minute 30 of each hour, when either resident arrives home, and when the kitchen door opens. Task blueprints apply their own due-state, notification and do-not-disturb checks.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: 30
      - platform: state
        entity_id: person.joao_carreira
        to: home
      - platform: state
        entity_id: person.bianca_pires
        to: home
      - platform: state
        entity_id: binary_sensor.kitchen_door
        from: "off"
        to: "on"
    action:
      - event: event_remaind_task_todo
