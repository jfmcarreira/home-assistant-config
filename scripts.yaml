  description: Prepare exit lighting and gate access for a short trip, closing the gate when a resident leaves without shutting down the house.
  mode: single
  icon: mdi:arrow-u-down-left
  sequence:
  - variables:
      joao_was_home: '{{ is_state(''binary_sensor.joao_home'',''on'' ) }}'
      bianca_was_home: '{{ is_state(''binary_sensor.bianca_home'',''on'' ) }}'
