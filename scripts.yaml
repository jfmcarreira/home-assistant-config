cover_scene_rain_mode:
  alias: Routina Modo de Chuva
  description: Apply each enabled shutter's rain routine across the house, using its configured rainy position rather than closing every shutter unconditionally.
  mode: single
  sequence:
  - service: script.cover_group_action
    data:
      action_to_run: script.cover_close_when_raining
      control_switch: close_in_rain
      covers_list:
      - living_room
      - stairs
      - bedroom_henrique
      - bedroom_ricardo
      - master_bedroom
      - bathroom
      - bedroom_rc
      - laundry
      - kitchen
      - office
lights_arriving_home:
  alias: Routina de Chegar a Casa
  description: At night, cycle the rear, side and kitchen-door lights off for five seconds and back on. Run exterior cleanup in parallel with an indoor arrival branch that requires the kitchen door to open within two minutes; suppress the living-room light in night mode.
  mode: restart
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.night
      state: 'on'
    then:
    - target:
        entity_id:
        - light.exterior_wall_back
        - light.exterior_wall_side
        - light.kitchen_door
      data: {}
      action: light.turn_off
    - delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
    - target:
        entity_id:
        - light.exterior_wall_back
        - light.exterior_wall_side
        - light.kitchen_door
      data: {}
      action: light.turn_on
  - action: input_text.set_value
    target:
      entity_id: input_text.script_step_message
    data:
      value: Aguardar a Porta Abrir
  - parallel:
    - sequence:
      - wait_for_trigger:
        - entity_id:
          - binary_sensor.kitchen_door
          to: 'on'
          trigger: state
        timeout:
          minutes: 2
      - action: input_text.set_value
        target:
          entity_id: input_text.script_step_message
        data:
          value: Aguardar a Porta Fechar
      - wait_for_trigger:
        - entity_id:
          - binary_sensor.kitchen_door
          to: 'off'
          for:
            minutes: 5
          trigger: state
        - entity_id:
          - light.kitchen_door
          to: 'off'
          trigger: state
        timeout:
          minutes: 2
      - target:
          entity_id:
          - light.exterior_wall_side
          - light.exterior_wall_back
          - light.kitchen_door
        data: {}
        action: light.turn_off
      - action: input_text.set_value
        target:
          entity_id: input_text.script_step_message
        data:
          value: ''
    - sequence:
      - wait_for_trigger:
        - entity_id:
          - binary_sensor.kitchen_door
          to: 'on'
          trigger: state
        timeout:
          minutes: 2
        continue_on_timeout: false
      - if:
        - condition: state
          entity_id: binary_sensor.night
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id:
            - light.kitchen_led
            - light.hallway
          data: {}
        - if:
          - condition: state
            entity_id: binary_sensor.night_mode
            state: 'off'
          then:
          - action: light.turn_on
            metadata: {}
            target:
              entity_id: light.living_room
            data: {}
lights_control_gate_front_lights:
  alias: Controlar Luzes do Portão
  sequence:
  - condition: state
    entity_id: binary_sensor.night
    state: 'on'
  - target:
      entity_id: light.gate_lights
    data: {}
    action: light.turn_on
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.gate_close
      to: 'on'
      for:
        hours: 0
        minutes: 0
        seconds: 10
      trigger: state
    timeout:
      hours: 1
      minutes: 0
      seconds: 0
      milliseconds: 0
  - target:
      entity_id: light.gate_lights
    data: {}
    action: light.turn_off
  mode: single
  description: At night, light the gate until the gate-closed sensor turns on for ten seconds, or a one-hour wait expires.
gate_notify_door_bell_snapshot:
  alias: Campainha - Notificar App
  description: Capture the front camera to the fixed web-accessible doorbell snapshot file and send high-priority image notifications to both residents' phones, regardless of presence.
  mode: single
  variables:
    snapshot_create_file_path: /config/www/camera/snapshot_front_door.jpg
    snapshot_access_file_path: '{{ snapshot_create_file_path | replace(''/config/www'',''/local'')}}'
  sequence:
  - action: camera.snapshot
    entity_id: camera.front
    data:
      filename: '{{ snapshot_create_file_path }}'
  - repeat:
      for_each:
      - person: person.joao_carreira
        device: notify.mobile_app_radium
      - person: person.bianca_pires
        device: notify.mobile_app_calcium
      sequence:
      - metadata: {}
        data:
          title: Exterior
          message: Campainha accionada
          data:
            channel: Segurança
            priority: high
            persistent: true
            sticky: true
            image: '{{ snapshot_access_file_path }}'
            clickAction: entityId:camera.front
        action: '{{ repeat.item.device }}'
gate_display_front_camere_tablet:
  alias: Campainha - Mostrar Camera da Frente Tablet
  description: Open the front-camera Browser Mod popup on the configured browser. Wait up to five minutes for a door opening, pedestrian unlock or gate opening before issuing the follow-up more-info call to the second configured browser ID.
  mode: single
  sequence:
  - target: {}
    data:
      entity: camera.front
      large: true
      ignore_popup_card: true
      browser_id:
      - faf97a427471d1228ad59c92775a6147
    action: browser_mod.more_info
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.kitchen_door
      - binary_sensor.front_door
      from:
      to: 'on'
      trigger: state
    - entity_id:
      - lock.gate_door
      from:
      to: unlocked
      trigger: state
    - entity_id:
      - cover.gate
      from: closed
      to: opening
      trigger: state
    - entity_id:
      - cover.gate
      from:
      to: open
      trigger: state
    timeout:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
  - action: browser_mod.more_info
    target: {}
    data:
      browser_id:
      - browser_mod_d95bc50a_a72ebf8b
routine_exit_house_to_work_bianca:
  alias: Routina ir Trabalhar - Bianca
  description: If Joao is away and no day off is selected, launch the all-off departure routine, wait through the kitchen-door sequence and open the gate. Otherwise light the exit path, open the gate for Bianca and close it only once she is away within the ten-minute wait.
  mode: single
  icon: mdi:exit-run
  sequence:
  - if:
    - condition: state
      entity_id: input_boolean.day_off_work
      state: 'off'
    - condition: state
      entity_id: binary_sensor.joao_home
      state: 'off'
    then:
    - continue_on_error: true
      data: {}
      target:
        entity_id: script.routine_exit_house_all_off
      action: script.turn_on
    - action: script.sequence_door_open
      data: {}
    - delay:
        seconds: 10
    - data: {}
      target:
        entity_id: cover.gate
      action: cover.open_cover
    - stop:
  - data: {}
    target:
      entity_id: script.sequence_leaving_home_lights
    action: script.turn_on
  - condition: state
    entity_id: binary_sensor.bianca_home
    state: 'on'
  - data: {}
    target:
      entity_id: cover.gate
    action: cover.open_cover
  - action: input_text.set_value
    target:
      entity_id: input_text.script_step_message
    data:
      value: Aguardar a Bianca sair de casa
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.bianca_home
      to: 'off'
      from: 'on'
      trigger: state
    timeout: 00:10:00
  - condition: state
    entity_id: binary_sensor.bianca_home
    state: 'off'
  - data: {}
    target:
      entity_id: cover.gate
    action: cover.close_cover
routine_exit_house_to_work_joao:
  alias: Routina ir Trabalhar - Joao
  description: If Bianca is away and no day off is selected, launch the all-off departure routine and sensor-based gate routine after the kitchen-door sequence. Otherwise light the exit path, start the gate routine and close the gate after Joao leaves or a 20-minute wait expires.
  mode: single
  icon: mdi:exit-run
  sequence:
  - if:
    - condition: state
      entity_id: input_boolean.day_off_work
      state: 'off'
    - condition: state
      entity_id: binary_sensor.bianca_home
      state: 'off'
    then:
    - continue_on_error: true
      data: {}
      target:
        entity_id: script.routine_exit_house_all_off
      action: script.turn_on
    - action: script.sequence_door_open
      data: {}
    - continue_on_error: true
      data: {}
      action: script.turn_on
      target:
        entity_id: script.routine_gate_open_auto_close_sensors
    - stop:
  - data: {}
    target:
      entity_id: script.sequence_leaving_home_lights
    action: script.turn_on
  - condition: state
    entity_id: binary_sensor.joao_home
    state: 'on'
  - continue_on_error: true
    data: {}
    action: script.turn_on
    target:
      entity_id: script.routine_gate_open_auto_close_sensors
  - action: input_text.set_value
    target:
      entity_id: input_text.script_step_message
    data:
      value: Aguardar o João sair de casa
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.joao_home
      to: 'off'
      from: 'on'
      trigger: state
    timeout:
      hours: 0
      minutes: 20
      seconds: 0
      milliseconds: 0
  - data: {}
    target:
      entity_id: cover.gate
    action: cover.close_cover
routine_leaving_and_coming_back:
  alias: Vou Ali e Já Venho
  description: Light the exit path, run the kitchen-door sequence, wait ten seconds and open the gate if either resident is home. Close it after a resident leaves; stop without closing if no departure occurs within ten minutes.
  mode: single
  icon: mdi:arrow-u-down-left
  sequence:
  - variables:
      joao_was_home: '{{ is_state(''binary_sensor.joao_home'',''on'' ) }}'
      bianca_was_home: '{{ is_state(''binary_sensor.bianca_home'',''on'' ) }}'
  - service: script.turn_on
    data: {}
    target:
      entity_id: script.sequence_leaving_home_lights
  - service: script.sequence_door_open
  - action: input_text.set_value
    target:
      entity_id: input_text.script_step_message
    data:
      value: Abrir o portão
  - delay:
      seconds: 10
  - condition:
    - or:
      - condition: state
        entity_id: binary_sensor.joao_home
        state: 'on'
      - condition: state
        entity_id: binary_sensor.bianca_home
        state: 'on'
  - service: cover.open_cover
    data: {}
    target:
      entity_id: cover.gate
  - action: input_text.set_value
    target:
      entity_id: input_text.script_step_message
    data:
      value: Aguardar alguém sair de casa
  - wait_for_trigger:
    - platform: state
      entity_id:
      - binary_sensor.bianca_home
      - binary_sensor.joao_home
      from: 'on'
      to: 'off'
    timeout: 00:10:00
    continue_on_timeout: false
  - action: input_text.set_value
    target:
      entity_id: input_text.script_step_message
    data:
      value: Fechar o portão
  - service: cover.close_cover
    data: {}
    target:
      entity_id: cover.gate
  - action: input_text.set_value
    target:
      entity_id: input_text.script_step_message
    data:
      value: ''
