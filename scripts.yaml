routina_de_abrir_e_fechar_o_portao_com_porta_da_cozinha_duplicar:
  sequence:
  - if:
    - condition: state
      entity_id: cover.gate
      state:
      - closed
    then:
    - action: cover.open_cover
      metadata: {}
      target:
        entity_id: cover.gate
      data: {}
  - wait_for_trigger:
    - trigger: event.received
      target:
        entity_id: event.gate_photocell_events
      options:
        event_type:
        - car
    timeout:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
    continue_on_timeout: false
  - delay:
      hours: 0
      minutes: 0
      seconds: 3
      milliseconds: 0
  - action: cover.close_cover
    metadata: {}
    target:
      entity_id: cover.gate
    data: {}
  alias: Routina de Abrir e Fechar o Portão com Sensores
  description: Open the gate and close it after a car photocell event.
