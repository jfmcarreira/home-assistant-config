  alias: Routina ir Trabalhar - Bianca
  description: Prepare lighting and gate access for Bianca's departure to work, selecting the house shutdown routine according to Joao's presence and the day-off setting.
  mode: single
  icon: mdi:exit-run
  sequence:
  - if:
    - condition: state
      entity_id: input_boolean.day_off_work
      state: 'off'
    - condition: state
      entity_id: binary_sensor.joao_home
      state: 'off'
    then:
    - continue_on_error: true
      data: {}
      target:
        entity_id: script.routine_exit_house_all_off
      action: script.turn_on
    - action: script.sequence_door_open
      data: {}
    - delay:
        seconds: 10
    - data: {}
      target:
        entity_id: cover.gate
      action: cover.open_cover
    - stop:
  - data: {}
    target:
      entity_id: script.sequence_leaving_home_lights
    action: script.turn_on
  - condition: state
    entity_id: binary_sensor.bianca_home
    state: 'on'
  - data: {}
    target:
      entity_id: cover.gate
    action: cover.open_cover
  - action: input_text.set_value
    target:
      entity_id: input_text.script_step_message
    data:
      value: Aguardar a Bianca sair de casa
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.bianca_home
      to: 'off'
      from: 'on'
      trigger: state
    timeout: 00:10:00
  - condition: state
    entity_id: binary_sensor.bianca_home
    state: 'off'
  - data: {}
    target:
      entity_id: cover.gate
    action: cover.close_cover
