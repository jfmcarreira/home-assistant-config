      temperature_sensor: sensor.temperature_bedroom_henrique
      heat_after: true
  alias: Routina de Desumidificação Quarto do Henrique (Com Aquecimento)
  description: Run Henrique's bedroom AC drying with optional heating when the room is not above 20 C, followed by the shared heating stop conditions and 30-minute maximum wait.
routina_de_desumidificacao:
  sequence:
  - action: script.turn_on
    metadata: {}
    target:
      entity_id:
      - script.hvac_routine_dehumidifier_living_room
      - script.hvac_routine_dehumidifier_office
      - script.hvac_routine_dehumidifier_hall
      - script.hvac_routine_dehumidifier_master_bedroom
      - script.hvac_routine_dehumidifier_bedroom_ricardo
      - script.hvac_routine_dehumidifier_bedroom_henrique
    data: {}
  alias: Routina de Desumidificação
  description: Start the six room-specific AC drying scripts asynchronously without post-drying heating. These use AC dry mode, not the portable dehumidifier.
cover_scene_close_with_heat:
  sequence:
  - if:
    - condition: numeric_state
      entity_id: sensor.sun_solar_azimuth
      above: 180
    then:
    - action: script.cover_group_action
      data:
        action_to_run: cover.close_cover
        control_switch: close_with_heat
        covers_list:
        - master_bedroom
        - kitchen
    else:
    - action: script.cover_group_action
      data:
        action_to_run: cover.close_cover
        control_switch: close_with_heat
        covers_list:
        - stairs
        - bedroom_rc
        - laundry
  alias: Fechar Estores - Exposição Solar
  description: Close heat-enabled kitchen and master-bedroom shutters when sun azimuth exceeds 180 degrees; otherwise act on stairs, the ground-floor bedroom and laundry. This manually invoked routine does not itself check outdoor temperature or absence.
fechar_todos_os_estores_sol_calor:
  sequence:
  - action: script.cover_group_action
    data:
      action_to_run: cover.close_cover
      control_switch: close_with_heat
      covers_list:
      - living_room
      - stairs
      - bedroom_henrique
      - bedroom_ricardo
      - master_bedroom
      - bathroom
      - bedroom_rc
      - laundry
      - kitchen
      - office
  alias: Fechar Todos os Estores - Sol/Calor
  description: Close the ten listed shutters through the heat-control group worker, respecting each room's close_with_heat helper and recording Sol as the group action reason.
cover_bedroom_middle:
  sequence:
  - action: esphome.bhonofre_cover_bedroom_henrique_middle_open_cover
    metadata: {}
    data: {}
  - action: esphome.bhonofre_cover_bedroom_ricardo_middle_open_cover
    metadata: {}
    data: {}
  - action: esphome.bhonofre_cover_master_bedroom_middle_open_cover
    metadata: {}
    data: {}
  alias: Estores dos Quartos a Meio
  description: Call the three bedroom ESPHome middle-opening services, using each device's configured higher opening position rather than a hard-coded 50 percent.
test_tv_notification:
  use_blueprint:
    path: Trooped/notification.yaml
    input:
      message: O Henrique está a chorar
      title: Baby Monitor
      mdi_icon: mdi:baby
      interrupt: true
      action_1_id: show_baby_monitor_henrique
      action_1_label: Mostrar Camera
      action_1_action:
      - action: script.test_camera_feed
        metadata: {}
        data: {}
  alias: test_tv_notification
  description: Test the external TV-notification blueprint with a baby-monitor alert and an action that starts the Henrique camera-feed test.
test_camera_feed:
  use_blueprint:
    path: Trooped/camera.yaml
    input:
      camera_entity: camera.baby_monitor_henrique
      source_type: entity
      auto_hide: 15
  alias: test_camera_feed
  description: Test the external TV camera blueprint with Henrique's baby-monitor camera entity and an auto-hide setting of 15.
routina_de_abrir_e_fechar_o_portao_com_porta_da_cozinha_duplicar:
  sequence:
  - if:
    - condition: state
      entity_id: cover.gate
      state:
      - closed
    then:
    - action: cover.open_cover
      metadata: {}
      target:
        entity_id: cover.gate
      data: {}
  - parallel:
    - sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id:
          - sensor.driveway_car_active_count
          - sensor.driveway_car_count
          - binary_sensor.driveway_camera_car
    - sequence:
      - wait_for_trigger:
        - trigger: event.received
          target:
            entity_id: event.gate_photocell_events
          options:
            event_type:
            - car
      - delay:
          hours: 0
          minutes: 0
          seconds: 3
          milliseconds: 0
  - action: cover.close_cover
    metadata: {}
    target:
      entity_id: cover.gate
    data: {}
  alias: Routina de Abrir e Fechar o Portão com Sensores
  description: Open a closed gate, then wait for both parallel branches to finish before closing it. One branch requires a driveway vehicle-sensor change; the other requires a car photocell event plus three seconds. Neither branch has a timeout.
door_bell_snapshot:
  sequence:
  - action: camera.snapshot
    entity_id: camera.front
    data:
      filename: /media/Campainha/{{now().year}}-{{"%02d" | format(now().month)}}-{{"%02d"
        | format(now().day)}}_{{"%02d" | format(now().hour)}}h{{"%02d" | format(now().minute)}}.jpg
  alias: Campainha - Guardar Snapshot
  description: Save a front-camera doorbell snapshot under /media/Campainha with a date-and-minute filename. Multiple calls within the same minute use the same filename.
door_bell_sound_office:
  sequence:
  - action: music_assistant.play_announcement
    target:
      entity_id:
      - media_player.home_assistant_voice_office_ma
    data:
      url: http://10.20.107.2/local/door_bell.wav
  alias: Campainha - Notificação Sonora Escritório
  description: Play the local doorbell audio as a Music Assistant announcement on the office voice player. Eligibility checks are performed by the calling doorbell sequence.
door_bell_sound_google_home:
  sequence:
  - action: music_assistant.play_announcement
    target:
      entity_id:
      - media_player.ghm_kitchen
    data:
      url: http://10.20.107.2/local/door_bell.wav
  alias: Campainha - Notificação Sonora Google
  description: Play the local doorbell audio as a Music Assistant announcement on the kitchen Google Home player.
door_bell_sequence:
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.notify_home
      state: 'on'
    - condition: state
      entity_id: binary_sensor.notification_non_disturb
      state: 'off'
    - condition: state
      entity_id: input_boolean.door_bell_sound
      state: 'on'
    then:
    - action: script.turn_on
      target:
        entity_id: script.door_bell_sound_office
    - action: script.turn_on
      target:
        entity_id: script.door_bell_sound_google_home
    - action: script.turn_on
      target:
        entity_id: script.door_bell_sound_bedrooms
  - action: script.turn_on
    target:
      entity_id: script.door_bell_notify_snapshot
  - action: script.turn_on
    target:
      entity_id: script.door_bell_snapshot
  - action: script.turn_on
    target:
      entity_id: script.door_bell_display_front_camera_tablet
  alias: Campainha - Sequência de Notificações
  description: Start audible doorbell scripts only when someone is home, do-not-disturb is off and doorbell sound is enabled. Always launch the configured mobile snapshot, archival snapshot and tablet-camera scripts asynchronously.
campainha_notificacao_sonora_google_duplicar:
  sequence:
  - if:
    - condition: time
      after: 09:00:00
      before: '21:00:00'
    - condition: numeric_state
      entity_id: cover.bedroom_henrique
      attribute: current_position
      above: 0
    - condition: numeric_state
      entity_id: cover.bedroom_ricardo
      attribute: current_position
      above: 0
    then:
    - action: music_assistant.play_announcement
      target:
        entity_id: media_player.ghm_hall
      data:
        url: http://10.20.107.2/local/door_bell.wav
  alias: Campainha - Notificação Sonora Quartos
  description: Play the doorbell announcement on the upstairs hall speaker only between 09:00 and 21:00 and when both children's bedroom shutters have a position above zero, avoiding a chime when either room is darkened.
cctv_analyse_front_camera:
  sequence:
  - action: llmvision.image_analyzer
    data:
      provider: 01M1MJWSYWNG2741GD56NMKXTD
      model: gpt-4o-mini
      message: 'Resume o que se encontra visível de forma curta, objetiva e em português
        de Portugal.

        Apresenta tudo como observação direta. Não especules nem acrescentes detalhes
        irrelevantes.'
      include_filename: false
      max_tokens: 200
      image_entity:
      - camera.front
      response_format: text
    response_variable: response_description
  - variables:
      result:
        description: '{{ response_description.response_text }}'
  - stop: ''
    response_variable: result
  alias: Analisar a Câmara da Frente
  description: Analyze the current front-camera image when asked what is in front of the house. Return a description field containing concise European Portuguese observations from LLM Vision.
analisar_a_camara_da_frente_duplicar:
  sequence:
  - action: llmvision.image_analyzer
    data:
      provider: 01M1MJWSYWNG2741GD56NMKXTD
      model: gpt-4o-mini
      message: 'Resume o que se encontra visível de forma curta, objetiva e em português
        de Portugal.

        Apresenta tudo como observação direta. Não especules nem acrescentes detalhes
        irrelevantes.'
      include_filename: false
      max_tokens: 200
      response_format: text
      image_entity:
      - camera.driveway
    response_variable: response_description
  - variables:
      result:
        description: '{{ response_description.response_text }}'
  - stop: ''
    response_variable: result
  alias: Analisar a Câmara da Entrada
  description: Analyze the current driveway camera when asked about the gate entrance, west facade, area near the kitchen or cars. Return a description field containing concise European Portuguese observations from LLM Vision.
llm_script_for_music_assistant_voice_requests:
  alias: LLM Script for Music Assistant voice requests
  description: Use the external Music Assistant voice-script blueprint to resolve and play voice-requested media, with the office Music Assistant voice player as the default target.
  use_blueprint:
    path: music-assistant/llm_voice_script.yaml
    input:
      default_player: media_player.home_assistant_voice_office_ma
hvac_solar_living_room:
  alias: AC Sala - Apoio Solar (Script)
