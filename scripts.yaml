      heat_after: false
  alias: Routina de Desumidificação Quarto do Henrique
  description: Run Henrique's bedroom AC in the shared drying routine without post-drying heating, with an initial 18 C dry request and up to 90 minutes before cleanup.
hvac_routine_dehumidifier_heat_office:
  description: Run office AC drying with post-drying heating enabled when room temperature is not above 20 C. The shared blueprint limits the heating phase to 30 minutes and shuts the unit down afterward.
  use_blueprint:
    path: hvac/hvac_dehumidifier_routine.yaml
    input:
      hvac_entitiy: climate.office
      temperature_sensor: sensor.temperature_office
      heat_after: true
  alias: Routina de Desumidificação Escritório (Com Aquecimento)
hvac_routine_dehumidifier_heat_living_room:
  description: Run living-room AC drying with optional heating when the room is not above 20 C, followed by the shared heating stop conditions and 30-minute maximum wait.
  use_blueprint:
    path: hvac/hvac_dehumidifier_routine.yaml
    input:
      hvac_entitiy: climate.living_room
      temperature_sensor: sensor.temperature_living_room
      heat_after: true
  alias: Routina de Desumidificação Sala (Com Aquecimento)
hvac_routine_dehumidifier_heat_hall:
  description: Run upstairs hall AC drying with optional heating when the room is not above 20 C, followed by the shared heating stop conditions and 30-minute maximum wait.
  use_blueprint:
    path: hvac/hvac_dehumidifier_routine.yaml
    input:
      hvac_entitiy: climate.hall
      temperature_sensor: sensor.temperature_hall
      heat_after: true
  alias: Routina de Desumidificação Sótão (Com Aquecimento)
hvac_routine_dehumidifier_heat_master_bedroom:
  description: Run master-bedroom AC drying with optional heating when the room is not above 20 C, followed by the shared heating stop conditions and 30-minute maximum wait.
  use_blueprint:
    path: hvac/hvac_dehumidifier_routine.yaml
    input:
      hvac_entitiy: climate.master_bedroom
      temperature_sensor: sensor.temperature_master_bedroom
      heat_after: true
