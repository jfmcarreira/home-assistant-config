sequence_door_open:
  alias: Sequência Esperar Pela Abertura da Porta da Cozinha
  description: Coordinate the kitchen-door opening and closing sequence while displaying departure progress.
  mode: parallel
  icon: mdi:door
  trace:
    stored_traces: 1
  sequence:
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: binary_sensor.kitchen_door
        state: 'on'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.script_step_message
      data:
        value: Aguardar pela Porta da Cozinha Abrir
    - wait_for_trigger:
      - entity_id: binary_sensor.kitchen_door
        to: 'on'
        trigger: state
      timeout: 00:5:00
  - action: input_text.set_value
    target:
      entity_id: input_text.script_step_message
    data:
      value: Aguardar pela Porta da Cozinha Fechar
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.kitchen_door
      to: 'off'
      trigger: state
    timeout: 00:01:00
  - action: input_text.set_value
    target:
      entity_id: input_text.script_step_message
    data:
      value: ''
  max: 10
sequence_leaving_home_lights:
  alias: Sequência de Ligar as Luzes ao Sair de Casa
  description: Illuminate the exterior exit path at night and switch the lights off as the kitchen-door and gate departure sequence progresses.
  mode: restart
  trace:
    stored_traces: 1
  sequence:
  - condition: state
    entity_id: binary_sensor.night
    state: 'on'
  - if:
    - condition: state
      entity_id: binary_sensor.kitchen_door
      state: 'off'
    then:
    - wait_for_trigger:
      - entity_id:
        - binary_sensor.kitchen_door
        to: 'on'
        trigger: state
      timeout: 00:05:00
      continue_on_timeout: false
  - target:
      entity_id:
      - light.exterior_wall_back
      - light.exterior_wall_side
      - light.kitchen_door
    data: {}
    action: light.turn_on
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.kitchen_door
      to: 'off'
      trigger: state
    timeout: 00:05:00
    continue_on_timeout: true
  - delay:
      minutes: 1
  - data: {}
    target:
      entity_id:
      - light.exterior_wall_back
      - light.kitchen_door
    action: light.turn_off
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: cover.gate
        state: closed
    then:
    - wait_for_trigger:
      - entity_id:
        - cover.gate
        to: closed
        trigger: state
      timeout: 00:10:00
  - target:
      entity_id:
      - light.exterior_wall_back
      - light.exterior_wall_side
      - light.kitchen_door
    data: {}
    action: light.turn_off
sequence_notify_tasks:
  alias: Sequência de Notificar sobre as Tarefas
  description: Announce a pending reminder to start the dishwasher on the kitchen speaker.
  mode: single
  icon: mdi:alert
  sequence:
  - if:
    - condition: state
      entity_id: input_boolean.reminder_dish_washing_machine
      state: 'on'
    then:
    - service: tts.cloud_say
      data:
        cache: true
        entity_id:
        - media_player.ghm_kitchen
        message: Deve ligar a máquina de lavar a loiça
        language: pt-PT
