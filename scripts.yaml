  fields: {}
routine_gate_open_auto_close:
  sequence:
  - if:
    - condition: state
      entity_id: cover.gate
      state:
      - closed
    then:
    - action: cover.open_cover
      metadata: {}
      target:
        entity_id: cover.gate
      data: {}
  - wait_for_trigger:
    - trigger: state
      entity_id:
      - sensor.driveway_car_active_count
      - sensor.backyard_camera_car_active_count
      - sensor.front_camera_car_active_count
      - binary_sensor.driveway_camera_reolink_vehicle
  - if:
    - condition: state
      entity_id: binary_sensor.kitchen_door
      state:
      - 'off'
    then:
    - wait_for_trigger:
      - trigger: state
        entity_id:
        - binary_sensor.kitchen_door
        from:
        - 'off'
        to:
        - 'on'
      timeout:
        hours: 0
        minutes: 10
        seconds: 0
        milliseconds: 0
      continue_on_timeout: false
    alias: Verificar se a porta está fechada para esperar que ela se abra
  - wait_for_trigger:
    - trigger: state
      entity_id:
      - binary_sensor.kitchen_door
      from:
      - 'on'
      to:
      - 'off'
    timeout:
      hours: 0
      minutes: 30
      seconds: 0
      milliseconds: 0
    continue_on_timeout: false
    alias: Esperar pela porta fechar
  - wait_for_trigger:
    - trigger: gate.opened
      target:
        entity_id: cover.gate
      options:
        for: 00:00:00
    timeout:
      hours: 0
      minutes: 2
      seconds: 0
      milliseconds: 0
    continue_on_timeout: false
  - action: cover.close_cover
    metadata: {}
    target:
      entity_id: cover.gate
    data: {}
  alias: Routina de Abrir e Fechar o Portão com Porta da Cozinha
  description: Open a closed gate and wait without a timeout for a monitored vehicle-sensor change. Then require the kitchen door to open if needed, close, and a gate-open event before closing the gate; each subsequent wait has an aborting timeout.
gate_passagem_pedonal:
  alias: Passagem Pedonal
  description: Press the gate controller's single-opening button to request pedestrian passage, without waiting for gate completion.
  sequence:
  - action: button.press
    metadata: {}
    target:
      entity_id: button.gate_open_single
    data: {}
  mode: single
hvac_run_dehumidifier_heat:
  sequence:
  - action: script.turn_on
    metadata: {}
    target:
      entity_id:
      - script.hvac_routine_dehumidifier_heat_living_room
      - script.hvac_routine_dehumidifier_heat_office
      - script.hvac_routine_dehumidifier_heat_hall
      - script.hvac_routine_dehumidifier_heat_master_bedroom
      - script.hvac_routine_dehumidifier_heat_bedroom_ricardo
      - script.hvac_routine_dehumidifier_heat_bedroom_henrique
    data: {}
  alias: Routina de Desumidificação (Com Aquecimento)
  description: Start all six room-specific AC drying scripts asynchronously with optional post-drying heating enabled; each room script manages its own waits and shutdown.
routine_good_night_with_lights:
  sequence:
  - data: {}
    target:
      entity_id: light.stairs_wall
    action: light.turn_on
  - action: script.routine_good_night
    metadata: {}
    data: {}
  alias: Routina de Boa Noite (Com Luz)
  mode: single
  icon: mdi:sleep
  description: Turn on the stair wall light, then run the normal good-night routine synchronously. The base routine's later shutdown also includes the stair group.
hvac_routine_dehumidifier_office:
  description: Run the office AC drying blueprint with post-drying heating disabled. It requests 18 C dry mode, waits up to 90 minutes or for a mode change, then shuts down if the unit is still active.
  use_blueprint:
    path: hvac/hvac_dehumidifier_routine.yaml
    input:
      hvac_entitiy: climate.office
      temperature_sensor: sensor.temperature_office
      heat_after: false
  alias: Routina de Desumidificação Escritório
hvac_routine_dehumidifier_living_room:
  description: Run living-room AC in the shared drying routine without post-drying heating, with an initial 18 C dry request and up to 90 minutes before cleanup.
  use_blueprint:
    path: hvac/hvac_dehumidifier_routine.yaml
    input:
      hvac_entitiy: climate.living_room
      temperature_sensor: sensor.temperature_living_room
      heat_after: false
  alias: Routina de Desumidificação Sala
hvac_routine_dehumidifier_hall:
  description: Run upstairs hall AC in the shared drying routine without post-drying heating, with an initial 18 C dry request and up to 90 minutes before cleanup.
  use_blueprint:
    path: hvac/hvac_dehumidifier_routine.yaml
    input:
      hvac_entitiy: climate.hall
      temperature_sensor: sensor.temperature_hall
      heat_after: false
  alias: Routina de Desumidificação Sótão
hvac_routine_dehumidifier_master_bedroom:
  description: Run master-bedroom AC in the shared drying routine without post-drying heating, with an initial 18 C dry request and up to 90 minutes before cleanup.
  use_blueprint:
    path: hvac/hvac_dehumidifier_routine.yaml
    input:
      hvac_entitiy: climate.master_bedroom
      temperature_sensor: sensor.temperature_master_bedroom
      heat_after: false
  alias: Routina de Desumidificação Suite
hvac_routine_dehumidifier_bedroom_ricardo:
  description: Run Ricardo's bedroom AC in the shared drying routine without post-drying heating, with an initial 18 C dry request and up to 90 minutes before cleanup.
  use_blueprint:
