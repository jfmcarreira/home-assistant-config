cover_scene_rain_mode:
  alias: Routina Modo de Chuva
  description: Move rain-protection-enabled shutters to their configured rainy positions.
  mode: single
  sequence:
  - service: script.cover_group_action
    data:
      action_to_run: script.cover_close_when_raining
      control_switch: close_in_rain
      covers_list:
      - living_room
      - stairs
      - bedroom_henrique
      - bedroom_ricardo
      - master_bedroom
      - bathroom
      - bedroom_rc
      - laundry
      - kitchen
      - office
lights_arriving_home:
  alias: Routina de Chegar a Casa
  description: Coordinate exterior and indoor arrival lighting with the kitchen door, darkness and night mode.
  mode: restart
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.night
      state: 'on'
    then:
    - target:
        entity_id:
        - light.exterior_wall_back
        - light.exterior_wall_side
        - light.kitchen_door
      data: {}
      action: light.turn_off
    - delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
    - target:
        entity_id:
        - light.exterior_wall_back
        - light.exterior_wall_side
        - light.kitchen_door
      data: {}
      action: light.turn_on
  - action: input_text.set_value
    target:
      entity_id: input_text.script_step_message
    data:
      value: Aguardar a Porta Abrir
  - parallel:
    - sequence:
      - wait_for_trigger:
        - entity_id:
          - binary_sensor.kitchen_door
          to: 'on'
          trigger: state
        timeout:
          minutes: 2
      - action: input_text.set_value
        target:
          entity_id: input_text.script_step_message
        data:
          value: Aguardar a Porta Fechar
      - wait_for_trigger:
        - entity_id:
          - binary_sensor.kitchen_door
          to: 'off'
          for:
            minutes: 5
          trigger: state
        - entity_id:
          - light.kitchen_door
          to: 'off'
          trigger: state
        timeout:
          minutes: 2
      - target:
          entity_id:
          - light.exterior_wall_side
          - light.exterior_wall_back
          - light.kitchen_door
        data: {}
        action: light.turn_off
      - action: input_text.set_value
        target:
          entity_id: input_text.script_step_message
        data:
          value: ''
    - sequence:
      - wait_for_trigger:
        - entity_id:
          - binary_sensor.kitchen_door
          to: 'on'
          trigger: state
        timeout:
          minutes: 2
        continue_on_timeout: false
      - if:
        - condition: state
          entity_id: binary_sensor.night
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id:
            - light.kitchen_led
            - light.hallway
          data: {}
        - if:
          - condition: state
            entity_id: binary_sensor.night_mode
            state: 'off'
          then:
          - action: light.turn_on
            metadata: {}
            target:
              entity_id: light.living_room
            data: {}
lights_control_gate_front_lights:
  alias: Controlar Luzes do Portão
  sequence:
  - condition: state
    entity_id: binary_sensor.night
    state: 'on'
  - target:
      entity_id: light.gate_lights
    data: {}
    action: light.turn_on
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.gate_close
      to: 'on'
      for:
        hours: 0
        minutes: 0
        seconds: 10
      trigger: state
    timeout:
      hours: 1
      minutes: 0
      seconds: 0
      milliseconds: 0
  - target:
      entity_id: light.gate_lights
    data: {}
    action: light.turn_off
  mode: single
  description: Illuminate the gate at night and switch the lights off after closure or a timeout.
gate_notify_door_bell_snapshot:
  alias: Campainha - Notificar App
  description: Send both residents a doorbell notification with a front-camera snapshot.
  mode: single
  variables:
    snapshot_create_file_path: /config/www/camera/snapshot_front_door.jpg
    snapshot_access_file_path: '{{ snapshot_create_file_path | replace(''/config/www'',''/local'')}}'
  sequence:
  - action: camera.snapshot
    entity_id: camera.front
    data:
      filename: '{{ snapshot_create_file_path }}'
  - repeat:
      for_each:
      - person: person.joao_carreira
        device: notify.mobile_app_radium
      - person: person.bianca_pires
        device: notify.mobile_app_calcium
      sequence:
      - metadata: {}
        data:
          title: Exterior
          message: Campainha accionada
          data:
            channel: Segurança
            priority: high
            persistent: true
            sticky: true
            image: '{{ snapshot_access_file_path }}'
            clickAction: entityId:camera.front
        action: '{{ repeat.item.device }}'
gate_display_front_camere_tablet:
  alias: Campainha - Mostrar Camera da Frente Tablet
  description: Display the front-camera view on the configured tablet as part of the doorbell response.
  mode: single
  sequence:
  - target: {}
    data:
      entity: camera.front
      large: true
      ignore_popup_card: true
      browser_id:
      - faf97a427471d1228ad59c92775a6147
    action: browser_mod.more_info
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.kitchen_door
      - binary_sensor.front_door
      from:
      to: 'on'
      trigger: state
    - entity_id:
      - lock.gate_door
      from:
      to: unlocked
      trigger: state
    - entity_id:
      - cover.gate
      from: closed
      to: opening
      trigger: state
    - entity_id:
      - cover.gate
      from:
      to: open
      trigger: state
    timeout:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
  - action: browser_mod.more_info
    target: {}
    data:
      browser_id:
      - browser_mod_d95bc50a_a72ebf8b
