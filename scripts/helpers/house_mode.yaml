select_next_house_mode:
  description: Cycle On to Evening to Night to On. From Sleep select Night; from other states select On. This is a manual override of the house-mode selector also managed by AppDaemon.
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.house_mode
              state: "On"
          sequence:
            - service: input_select.select_option
              data:
                entity_id: input_select.house_mode
                option: "Evening"
        - conditions:
            - condition: state
              entity_id: input_select.house_mode
              state: "Evening"
          sequence:
            - service: input_select.select_option
              data:
                entity_id: input_select.house_mode
                option: "Night"
        - conditions:
            - condition: state
              entity_id: input_select.house_mode
              state: "Night"
          sequence:
            - service: input_select.select_option
              data:
                entity_id: input_select.house_mode
                option: "On"
        - conditions:
            - condition: state
              entity_id: input_select.house_mode
              state: "Sleep"
          sequence:
            - service: input_select.select_option
              data:
                entity_id: input_select.house_mode
                option: "Night"
      default:
        - service: input_select.select_option
          data:
            entity_id: input_select.house_mode
            option: "On"
