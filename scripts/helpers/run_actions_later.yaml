run_actions_later:
  alias: Executar Ações Mais Tarde
  description: "Wait the supplied hours, minutes and seconds, then run simple service calls sequentially. Calls may include entity_id and data; pending runs do not survive Home Assistant restarts."
  mode: parallel
  max: 20
  fields:
    delay:
      name: "Atraso"
      description: "Delay before execution, using hours, minutes and seconds. Other duration fields are not consumed by this script."
      required: true
      example: "{\"hours\": 1, \"minutes\": 0, \"seconds\": 0}"
      selector:
        duration:
    actions:
      name: "Ações"
      description: "Ordered list of service-call objects with action, optional entity_id and optional data. Calls without entity_id are made without a target."
      required: true
      example: "[{\"action\": \"climate.turn_off\", \"entity_id\": \"climate.living_room\"}]"
      selector:
        object:
  sequence:
    - delay:
        hours: "{{ delay.hours | default(0) }}"
        minutes: "{{ delay.minutes | default(0) }}"
        seconds: "{{ delay.seconds | default(0) }}"
    - repeat:
        for_each: "{{ actions }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ repeat.item.entity_id is defined }}"
                sequence:
                  - action: "{{ repeat.item.action }}"
                    target:
                      entity_id: "{{ repeat.item.entity_id }}"
                    data: "{{ repeat.item.data | default({}) }}"
            default:
              - action: "{{ repeat.item.action }}"
                data: "{{ repeat.item.data | default({}) }}"
